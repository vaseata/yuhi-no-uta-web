<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>黄色いテントの喫茶店</title>
<!--
  『夕日の歌』の世界で遊ぶ1画面の試作（案A・2026-10-21）。
  朝の鎌倉山での鯉の餌やり、開店から夜の閉店まで、喫茶店の一日をすごし、最後に路地でおにゃんどんに出会う。
  台詞と地の文のうち b:1 の行は本文そのまま（校了PDF 261013_aSongForDusk.pdf の表記で照合済み）。
  ?mark を付けて開くと、本文の行に朱の点が付く（著者・藤沢さんの確認用）。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e0d0c; --paper:#efe8da; --dim:#a39c90; --shu:#ED6D46; --shu-deep:#c8432a;
  --box:rgba(14,13,12,.86); --line:rgba(239,232,218,.22);
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --klee:"Klee One","Hiragino Maru Gothic ProN",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:var(--mincho);
  -webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#app{position:fixed;inset:0;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}

/* 絵（ぼかした地＋全体が見える絵）と、時刻の色 */
#scene{position:absolute;inset:0;isolation:isolate;overflow:hidden}
#bg{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(28px) brightness(.45);transition:background-image .8s}
#pic{position:absolute;left:0;right:0;top:48px;bottom:var(--boxh,34vh);margin:auto;width:100%;height:calc(100% - 48px - var(--boxh,34vh));
  object-fit:contain;transition:opacity .8s}
#pic.out{opacity:0}
#tint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2.4s ease,background 2.4s ease}
#tint.asa {opacity:.5; background:linear-gradient(180deg,#9fb3c8,#e9dcc4);mix-blend-mode:soft-light}
#tint.hiru{opacity:.35;background:linear-gradient(180deg,#e8d2ad,#bfa27a);mix-blend-mode:soft-light}
#tint.yu  {opacity:.62;background:linear-gradient(180deg,#ED6D46 0%,#f2a35c 48%,#6b2a1a 100%);mix-blend-mode:color}
#tint.yoru{opacity:.5; background:linear-gradient(180deg,#0d1b3a,#1e2a4a);mix-blend-mode:color}
#glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2.4s;
  background:radial-gradient(60% 50% at 50% 38%,rgba(237,109,70,.35),transparent 70%);mix-blend-mode:screen}
#glow.on{opacity:1}

/* 上の帯 */
#hud{position:relative;z-index:3;height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:linear-gradient(rgba(14,13,12,.8),rgba(14,13,12,0))}
#hud .yk{width:20px;height:20px;color:var(--shu);flex:none}
#hud .t{font-size:13px;letter-spacing:.12em;color:var(--dim)}
#clock{margin-left:auto;font-size:14px;letter-spacing:.14em}

/* 時刻の幕 */
#banner{position:absolute;z-index:4;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0;transition:opacity .9s}
#banner.on{opacity:1}
#banner b{display:block;font-weight:600;font-size:clamp(26px,5vw,40px);letter-spacing:.3em;text-shadow:0 2px 18px #000}
#banner small{display:block;margin-top:10px;font-size:13px;letter-spacing:.3em;color:var(--dim)}

/* ことばの箱 */
#box{position:absolute;z-index:3;left:0;right:0;bottom:0;height:var(--boxh,34vh);min-height:180px;
  padding:18px max(16px,calc(50% - 360px)) calc(18px + env(safe-area-inset-bottom));
  background:var(--box);border-top:1px solid var(--line);display:flex;flex-direction:column}
#who{min-height:1.4em;font-size:13px;letter-spacing:.2em;color:var(--shu);margin-bottom:8px}
#who.neko{font-family:var(--klee)}
#txt{font-size:clamp(16px,2.2vw,19px);line-height:1.95;letter-spacing:.04em;flex:1;overflow:auto}
#txt.neko{font-family:var(--klee)}
#txt.book::after{content:"";display:none}
.mark .book::before{content:"本文";font:10px var(--mincho);color:var(--shu);border:1px solid var(--shu);padding:0 4px;margin-right:8px;vertical-align:2px}
#next{position:absolute;right:max(20px,calc(50% - 340px));bottom:calc(14px + env(safe-area-inset-bottom));font-size:12px;color:var(--dim);
  animation:blink 1.4s infinite;opacity:0}
#next.on{opacity:1}
@keyframes blink{50%{opacity:.25}}
#choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
#choices button,.btn{display:block;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line);
  font-size:15px;letter-spacing:.06em;line-height:1.5;transition:border-color .2s,background .2s}
#choices button:hover,.btn:hover{border-color:var(--shu)}
#choices button.act{border-color:var(--shu);color:var(--paper)}
#choices button.act::before{content:"▸ ";color:var(--shu)}

/* 下から出る板（コーヒー・紙皿） */
.sheet{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:18px max(16px,calc(50% - 360px)) calc(20px + env(safe-area-inset-bottom));
  background:#161412;border-top:1px solid var(--shu);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet h3{font-weight:600;font-size:15px;letter-spacing:.2em;color:var(--shu);margin-bottom:4px}
.sheet .hint{font-size:13px;color:var(--dim);line-height:1.8;margin-bottom:12px;min-height:1.8em}
.sheet .row{display:flex;align-items:center;gap:18px}
.sheet svg{flex:none;width:120px;height:120px}
.sheet .ctl{flex:1;display:flex;flex-direction:column;gap:10px}
.big{padding:14px 16px;border:1px solid var(--shu);background:rgba(237,109,70,.08);font-size:16px;letter-spacing:.12em;text-align:center;touch-action:none}
.big:active,.big.down{background:rgba(237,109,70,.28)}
.big[disabled]{opacity:.35;pointer-events:none}
.meter{font-size:28px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.meter small{font-size:13px;color:var(--dim);margin-left:6px}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps i{flex:1;height:2px;background:var(--line)}
.steps i.on{background:var(--shu)}

#feed .items{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
#feed .items button{padding:12px;border:1px solid var(--line);font-size:15px;text-align:left}
#feed .items button.on{border-color:var(--shu);background:rgba(237,109,70,.12)}
#feed .items button.on::after{content:"　✓";color:var(--shu)}

/* 鯉の池（鎌倉山の庭の絵を暗く敷き、その上に鯉を描く） */
#pond{position:absolute;z-index:4;left:0;right:0;top:48px;bottom:220px;display:none;overflow:hidden;touch-action:none;cursor:crosshair}
#pond.on{display:block}
#pond::before{content:"";position:absolute;inset:-12px;background:url(assets/img007.jpg) center 80%/cover;filter:brightness(.42) contrast(1.15) blur(2px)}
#pond canvas{position:absolute;inset:0;width:100%;height:100%}
.kd{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.kd i{width:30px;height:30px;border:1px solid var(--line);display:grid;place-items:center;font:12px var(--mincho);font-style:normal;color:var(--dim);transition:color .3s}
.kd i.ok{color:var(--paper)}
.krow{display:flex;align-items:center;gap:16px}
.krow .big{flex:1}
.krow .meter{min-width:5.5em}

/* なでる */
#pet{position:absolute;z-index:4;inset:48px 0 var(--boxh,34vh) 0;display:none;cursor:pointer;touch-action:none}
#pet.on{display:block}
.goro{position:absolute;font-family:var(--klee);color:var(--shu);font-size:18px;pointer-events:none;
  animation:goro 1.4s ease-out forwards;text-shadow:0 1px 6px #000}
@keyframes goro{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-160%)}}

/* はじめ・おわり */
.cover{position:absolute;z-index:8;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px 16px;background:rgba(14,13,12,.9);transition:opacity .8s}
.cover.hide{opacity:0;pointer-events:none}
.cover .from{font-size:12px;letter-spacing:.3em;color:var(--dim)}
.cover h1{font-weight:600;font-size:clamp(26px,6vw,44px);letter-spacing:.24em;margin:14px 0 6px}
.cover .lede{font-size:14px;line-height:2;color:var(--dim);margin:12px 0 26px}
.cover .big{min-width:220px}
.cover .yk{width:26px;height:26px;color:var(--shu);margin-bottom:12px}

#end{overflow:auto;justify-content:flex-start}
#end .card{width:min(420px,100%);margin:auto;background:#f3ecdc;color:#1a1714;padding:14px 14px 18px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#end .ph{position:relative;aspect-ratio:3/2;overflow:hidden;isolation:isolate}
#end .ph img{width:100%;height:100%;object-fit:cover;display:block}
#end .ph i{position:absolute;inset:0;background:linear-gradient(180deg,#ED6D46,#f2a35c 50%,#6b2a1a);mix-blend-mode:color;opacity:.6}
#end .cap{font-size:13px;letter-spacing:.1em;margin-top:12px;line-height:1.9;text-align:left}
#end .cap b{font-weight:600;font-size:15px}
#end .guests{font-size:12px;color:#6b6157}
#end .after{margin-top:22px;font-size:14px;line-height:2;color:var(--paper)}
#end .acts{display:flex;flex-direction:column;gap:10px;margin-top:16px;width:min(420px,100%)}
#end .acts .big{background:var(--shu-deep);border-color:var(--shu-deep);color:#fff;text-decoration:none}
#end .acts .btn{text-align:center}

/* はじめの地図 */
.mapscr{justify-content:flex-start;overflow:auto;padding:28px 16px calc(24px + env(safe-area-inset-bottom))}
.mhead{text-align:center;margin-bottom:20px}
.mhead .lede{margin:10px 0 0}
.mgrid{display:grid;gap:20px;width:min(980px,100%);align-items:start}
@media (min-width:820px){ .mgrid{grid-template-columns:1.1fr 1fr} }
.mapbox{position:relative;width:100%;max-width:560px;justify-self:center;background:#f3ecdc;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.mapbox svg{display:block;width:100%;height:auto}
.emap text{font-family:var(--mincho);fill:#3a332c}
.emap .sea{font-size:13px;letter-spacing:.5em;fill:#8a7f70}
.emap .nm{font-size:15px;font-weight:600;letter-spacing:.14em}
.emap .sm{font-size:11px;letter-spacing:.12em;fill:#8a7f70}
.spot{cursor:pointer}
.spot .ring{fill:#fbf6ea;stroke:#3a332c;stroke-width:1.4;transition:stroke .2s,stroke-width .2s}
.spot.on .ring,.spot:hover .ring{stroke:#ED6D46;stroke-width:3}
.spot .halo{fill:none;stroke:#ED6D46;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:halo 2.4s infinite}
@keyframes halo{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
.spot.soon{opacity:.45}
.spot.soon .halo{display:none}
.mside{display:flex;flex-direction:column;gap:12px;text-align:left}
.mside .note{font-size:12px;color:var(--dim);text-align:center;margin-top:-4px}
.place{border:1px solid var(--line);padding:14px 16px;transition:border-color .2s;scroll-margin:16px}
.place.on{border-color:var(--shu)}
.place .no{font-size:11px;color:var(--shu);letter-spacing:.2em}
.place h2{font-weight:600;font-size:17px;letter-spacing:.12em;margin:2px 0 6px}
.place p{font-size:13px;color:var(--dim);line-height:1.8}
.place .gm{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.place .gm button{padding:9px 14px;border:1px solid var(--shu);font-size:14px;letter-spacing:.08em}
.place .gm button:hover{background:rgba(237,109,70,.12)}
.place .gm button.done::after{content:"　✓";color:var(--shu)}
.place .soon{display:inline-block;margin-top:10px;font-size:12px;color:var(--dim);border:1px dashed var(--line);padding:5px 10px;letter-spacing:.1em}
.mattr{font-size:10px;color:var(--dim);margin-top:16px}
.mattr a{color:inherit}
#tomap{margin-left:14px;font-size:12px;letter-spacing:.12em;border:1px solid var(--line);padding:4px 10px;color:var(--dim)}

@media (min-width:900px){ :root{--boxh:30vh} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="app">
  <div id="scene">
    <div id="bg"></div>
    <img id="pic" alt="">
    <div id="glow"></div>
    <div id="tint"></div>
  </div>

  <header id="hud">
    <svg class="yk" aria-hidden="true"><use href="#yk"/></svg>
    <span class="t" id="place">黄色いテントの喫茶店</span>
    <span id="clock"></span>
    <button id="tomap" type="button">地図</button>
  </header>

  <div id="banner"><b></b><small></small></div>
  <div id="pet" aria-label="おにゃんどんをなでる"></div>
  <div id="pond" aria-label="鯉の池。押したところへ餌を投げる"><canvas></canvas></div>

  <section id="box" aria-live="polite">
    <div id="who"></div>
    <div id="txt"></div>
    <div id="choices"></div>
    <div id="next">▼</div>
  </section>

  <!-- コーヒーを淹れる -->
  <section id="brew" class="sheet" aria-label="コーヒーを淹れる">
    <div class="steps"><i></i><i></i><i></i></div>
    <h3 id="bt"></h3>
    <p class="hint" id="bh"></p>
    <div class="row">
      <svg viewBox="0 0 120 120" id="bsvg" aria-hidden="true"></svg>
      <div class="ctl">
        <div class="meter" id="bm"></div>
        <button class="big" id="bb"></button>
      </div>
    </div>
  </section>

  <!-- 鯉の餌やり -->
  <section id="koi" class="sheet" aria-label="鯉の餌やり">
    <h3>鯉の餌やり</h3>
    <p class="hint" id="kh"></p>
    <div class="kd" id="kdots"></div>
    <div class="krow">
      <div class="meter" id="km"></div>
      <button class="big" id="kb">よーしよーし</button>
    </div>
  </section>

  <!-- 紙皿に盛る -->
  <section id="feed" class="sheet" aria-label="紙皿に盛る">
    <h3>紙皿に盛る</h3>
    <p class="hint">ぜんぶ選んだら、おにゃんどんの前に置く。</p>
    <div class="items">
      <button data-k="pan">冷凍のパンを牛乳にしたす</button>
      <button data-k="ham">ハム</button>
      <button data-k="anc">アンチョビ</button>
      <button data-k="oil">オリーブオイルをかける</button>
    </div>
    <button class="big" id="fb" disabled>紙皿を置く</button>
  </section>

  <!-- はじめ -->
  <section id="start" class="cover mapscr">
    <div class="mhead">
      <svg class="yk" aria-hidden="true"><use href="#yk"/></svg>
      <p class="from">梶町よん『夕日の歌』より</p>
      <h1>あそびの地図</h1>
      <p class="lede">三浦半島で、「僕」の毎日をすこしだけ。<br>行きたい場所を選んでください。</p>
    </div>
    <div class="mgrid">
      <div class="mapbox" id="mapbox">
        <svg class="emap" viewBox="0 0 400 490" role="img" aria-label="三浦半島の絵地図">
          <defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></defs>
          <rect width="400" height="490" fill="#d8d2c1"/>
          <g fill="none" stroke="#a99d86" stroke-width="1.2" stroke-linecap="round">
            <path d="M28 190 q8 -6 16 0 q8 6 16 0"/><path d="M104 250 q8 -6 16 0 q8 6 16 0"/><path d="M22 300 q8 -6 16 0 q8 6 16 0"/>
            <path d="M130 400 q8 -6 16 0 q8 6 16 0"/><path d="M60 430 q8 -6 16 0 q8 6 16 0"/><path d="M350 370 q8 -6 16 0 q8 6 16 0"/>
            <path d="M330 440 q8 -6 16 0 q8 6 16 0"/><path d="M372 240 q6 -5 12 0"/>
          </g>
          <g filter="url(#rough)">
            <path d="M-20 -20 H376 C362 40 350 80 356 110 C366 140 352 170 372 195 C392 215 400 240 398 262 C370 270 340 300 330 330 C320 360 330 380 318 405 C300 420 296 440 270 452 C252 462 232 458 222 446 C214 430 226 410 218 390 C212 360 222 330 214 300 C206 270 196 240 186 215 C176 190 170 160 158 140 C140 128 110 122 80 124 C50 126 24 118 -20 122 Z"
              fill="#f8f2e4" stroke="#3a332c" stroke-width="1.6" stroke-linejoin="round"/>
            <ellipse cx="246" cy="472" rx="26" ry="6" fill="#f8f2e4" stroke="#3a332c" stroke-width="1.4"/>
            <path d="M71 85 C150 58 205 70 267 96 C300 160 272 240 248 304 C236 350 252 392 238 430" fill="none" stroke="#ED6D46" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
          </g>
          <path d="M52 352 A30 30 0 0 1 112 352 Z" fill="#ED6D46"/>
          <path d="M40 358 H124 M54 364 H110 M68 370 H96" stroke="#ED6D46" stroke-width="1.6" stroke-linecap="round"/>
          <text class="sea" x="52" y="232">相模湾</text>
          <text class="sea" x="338" y="300">東京湾</text>
          <text class="sm" x="280" y="476">城ヶ島</text>
          <g transform="translate(176 448)" fill="none" stroke="#3a332c" stroke-width="1.2" stroke-linejoin="round"><path d="M-14 0 H14 L9 6 H-9 Z" fill="#fbf6ea"/><path d="M0 0 V-14 L9 -4 H0"/></g>
          <g transform="translate(34 452)"><path d="M0 -16 L5 0 L0 -3 L-5 0 Z" fill="#3a332c"/><text class="sm" x="0" y="12" text-anchor="middle" style="fill:#3a332c">北</text></g>
          <g id="spots"></g>
        </svg>
      </div>
      <div class="mside">
        <button class="big" id="go">一日をとおして遊ぶ</button>
        <p class="note">鎌倉山の鯉の餌やりから、三崎の喫茶店の閉店まで</p>
        <div id="places"></div>
      </div>
    </div>
  </section>

  <!-- おわり -->
  <section id="end" class="cover hide">
    <div class="card">
      <div class="ph"><img src="assets/img025.jpg" alt="窓際の席のご夫婦"><i></i></div>
      <p class="cap"><b>黄色いテントの喫茶店の、ある一日</b><br>
        <span class="guests">朝：鎌倉山で鯉の餌やり<br>今日のお客：漁師のおじさん／Ｙさんと Ｅさん／ご夫婦／それから、おにゃんどん</span></p>
    </div>
    <p class="after">この一日は、小説『夕日の歌』の中の一日です。<br>店をはじめた「僕」の、その先の話は本で。</p>
    <div class="acts">
      <a class="big" href="https://kajimachiyon.com/" target="_blank" rel="noopener">『夕日の歌』のこと</a>
      <button class="btn" id="again">地図へもどる</button>
    </div>
  </section>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
if (new URLSearchParams(location.search).has('mark')) document.body.classList.add('mark');

// ── 場面 ─────────────────────────────
const SCENES = {
  koi:  {img:'img007.jpg', tint:'asa',  clock:'午前八時',   label:'鯉の餌やり', sub:'鎌倉山・午前八時', place:'鎌倉山・御代川邸'},
  koi2: {img:'img008.jpg', tint:'asa',  clock:'午前八時', place:'鎌倉山・御代川邸'},
  asa: {img:'img015.jpg', tint:'asa',  clock:'午前十時',   label:'開店',     sub:'朝十時'},
  beer: {img:'img021.jpg', tint:'asa',  clock:'午前十時'},
  hiru: {img:'img028.jpg', tint:'hiru', clock:'午後二時',   label:'昼下がり', sub:'午後二時'},
  yu:   {img:'img025.jpg', tint:'yu',   clock:'午後五時',   label:'夕暮れ',   sub:'午後五時', glow:true},
  yoru: {img:'img024.jpg', tint:'yoru', clock:'午後九時',   label:'閉店',     sub:'夜九時'},
};
async function scene(key, withBanner = true){
  const s = SCENES[key], pic = $('#pic');
  pic.classList.add('out'); await sleep(450);
  pic.src = 'assets/' + s.img;
  $('#bg').style.backgroundImage = `url(assets/${s.img})`;
  $('#tint').className = s.tint;
  $('#glow').classList.toggle('on', !!s.glow);
  $('#clock').textContent = s.clock;
  $('#place').textContent = s.place || '黄色いテントの喫茶店';
  pic.onload = () => pic.classList.remove('out');
  if (pic.complete) pic.classList.remove('out');
  if (withBanner && s.label){
    $('#banner b').textContent = s.label; $('#banner small').textContent = s.sub;
    clear(); $('#banner').classList.add('on'); await sleep(1700); $('#banner').classList.remove('on'); await sleep(500);
  }
}

// ── ことば ───────────────────────────
let advance = null, typing = null;
function clear(){ $('#who').textContent=''; $('#txt').textContent=''; $('#choices').innerHTML=''; $('#next').classList.remove('on'); }
// say(誰, 文, 本文なら true)。誰が null なら地の文。
function say(who, text, book = false){
  clear();
  const neko = who === 'おにゃんどん' || who === '？';
  $('#who').textContent = who || ''; $('#who').className = neko ? 'neko' : '';
  const t = $('#txt'); t.className = (neko ? 'neko ' : '') + (book ? 'book' : '');
  return new Promise(res => {
    let i = 0; const chars = [...text];
    typing = () => { i = chars.length; t.textContent = text; };
    const tick = () => {
      if (i >= chars.length){ typing = null; $('#next').classList.add('on'); advance = res; return; }
      t.textContent = chars.slice(0, ++i).join(''); setTimeout(tick, 34);
    };
    tick();
  });
}
const N = (text, book) => say(null, text, book);         // 地の文
function choose(opts){                                   // 選ぶ。押した番号を返す
  $('#next').classList.remove('on');
  return new Promise(res => {
    const box = $('#choices'); box.innerHTML = '';
    opts.forEach((o, i) => {
      const b = document.createElement('button'); b.textContent = o; b.className = o.startsWith('［') ? 'act' : '';
      b.onclick = e => { e.stopPropagation(); box.innerHTML = ''; res(i); };
      box.appendChild(b);
    });
  });
}
function step(){ if (typing){ typing(); return; } if (advance){ const r = advance; advance = null; r(); } }
$('#box').addEventListener('click', step);
$('#scene').addEventListener('click', step);
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); step(); } });

// ── コーヒーを淹れる（挽く → 蒸らす → 注ぐ）。0〜4 点を返す ──
function brew(){
  const sh = $('#brew'), svg = $('#bsvg'), bt = $('#bt'), bh = $('#bh'), bm = $('#bm'), bb = $('#bb');
  const steps = sh.querySelectorAll('.steps i');
  const setStep = n => steps.forEach((s, i) => s.classList.toggle('on', i < n));
  clear(); sh.classList.add('on');
  return new Promise(async done => {
    let score = 0;

    // 一　挽く
    setStep(1); bt.textContent = '一　豆を挽く';
    bh.textContent = 'ミルのハンドルを回す。';
    let turns = 0; const need = 8;
    const mill = a => svg.innerHTML =
      `<rect x="34" y="52" width="52" height="56" fill="none" stroke="#efe8da" stroke-width="2"/>
       <path d="M40 52 L46 30 H74 L80 52" fill="none" stroke="#efe8da" stroke-width="2"/>
       <g transform="rotate(${a} 60 30)"><line x1="60" y1="30" x2="60" y2="8" stroke="#ED6D46" stroke-width="3"/><circle cx="60" cy="8" r="5" fill="#ED6D46"/></g>
       <rect x="40" y="${104 - turns * 5}" width="40" height="${turns * 5}" fill="#6b4a33"/>`;
    mill(0); bm.innerHTML = `0<small>/ ${need}</small>`; bb.textContent = 'ハンドルを回す'; bb.disabled = false;
    await new Promise(r => { bb.onclick = () => {
      turns++; mill(turns * 135); bm.innerHTML = `${turns}<small>/ ${need}</small>`;
      if (turns >= need){ bb.onclick = null; r(); }
    }; });
    await sleep(300);

    // 二　蒸らす（画面の 1 秒が 10 秒）
    setStep(2); bt.textContent = '二　蒸らす';
    bh.textContent = 'お湯を少しだけ入れて四十秒蒸らした。';
    bh.classList.add('book');
    const drip = r => svg.innerHTML =
      `<path d="M28 34 H92 L68 78 H52 Z" fill="none" stroke="#efe8da" stroke-width="2"/>
       <ellipse cx="60" cy="${40 - r * 8}" rx="${26 + r * 2}" ry="${6 + r * 9}" fill="#6b4a33" opacity=".9"/>
       <rect x="40" y="86" width="40" height="26" fill="none" stroke="#efe8da" stroke-width="2"/>`;
    drip(0); bm.innerHTML = `0<small>秒</small>`; bb.textContent = 'お湯を少しだけ入れる';
    await new Promise(r => bb.onclick = r);
    bb.textContent = 'ここで注ぎはじめる';
    const secs = await new Promise(r => {
      const t0 = performance.now(); let raf;
      const loop = now => {
        const s = Math.min(60, (now - t0) / 100);
        drip(Math.min(1, s / 40)); bm.innerHTML = `${Math.floor(s)}<small>秒</small>`;
        if (s >= 60){ bb.onclick = null; r(60); return; }
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
      bb.onclick = () => { cancelAnimationFrame(raf); bb.onclick = null; r((performance.now() - t0) / 100); };
    });
    const d = Math.abs(secs - 40);
    score += d <= 4 ? 2 : d <= 10 ? 1 : 0;
    bh.classList.remove('book');
    bh.textContent = d <= 4 ? '粉が、ふっくらと膨らんだ。' : secs < 40 ? 'すこし、早かったかもしれない。' : '蒸らしすぎたかもしれない。';
    await sleep(1100);

    // 三　注ぐ（押しているあいだ注ぐ。二杯分の線で止める）
    setStep(3); bt.textContent = '三　注ぐ';
    bh.textContent = 'そしてお湯を一定の速度で中央に垂らした。';
    bh.classList.add('book');
    const LO = 70, HI = 82;
    const server = (f, pouring) => svg.innerHTML =
      `${pouring ? '<line x1="60" y1="0" x2="60" y2="30" stroke="#efe8da" stroke-width="2" opacity=".7"/>' : ''}
       <path d="M30 30 V108 H90 V30" fill="none" stroke="#efe8da" stroke-width="2"/>
       <rect x="32" y="${108 - f * .78}" width="56" height="${f * .78}" fill="#5a3a24"/>
       <line x1="26" y1="${108 - LO * .78}" x2="94" y2="${108 - LO * .78}" stroke="#ED6D46" stroke-dasharray="3 3"/>
       <line x1="26" y1="${108 - HI * .78}" x2="94" y2="${108 - HI * .78}" stroke="#ED6D46" stroke-dasharray="3 3"/>
       <text x="96" y="${108 - (LO + HI) / 2 * .78 + 4}" fill="#ED6D46" font-size="9">二杯</text>`;
    let fill = 0; server(0); bm.innerHTML = `0<small>％</small>`; bb.textContent = '押しているあいだ注ぐ';
    fill = await new Promise(r => {
      let raf, last, on = false;
      const loop = now => {
        fill = Math.min(100, fill + (now - last) / 1000 * 24); last = now;
        server(fill, true); bm.innerHTML = `${Math.floor(fill)}<small>％</small>`;
        if (fill >= 100){ stop(); return; }
        raf = requestAnimationFrame(loop);
      };
      const start = e => { e.preventDefault(); if (on) return; on = true; bb.classList.add('down'); last = performance.now(); raf = requestAnimationFrame(loop); };
      const stop = () => { if (!on) return; on = false; bb.classList.remove('down'); cancelAnimationFrame(raf); server(fill);
        bb.onpointerdown = bb.onpointerup = bb.onpointerleave = bb.onpointercancel = null; r(fill); };
      bb.onclick = null;
      bb.onpointerdown = start; bb.onpointerup = bb.onpointerleave = bb.onpointercancel = stop;
    });
    bh.classList.remove('book');
    const inBand = fill >= LO && fill <= HI;
    score += inBand ? 2 : (fill >= LO - 12 && fill < 100) ? 1 : 0;
    bh.textContent = fill >= 100 ? 'あふれてしまった。' : inBand ? 'ちょうど、二杯分。' : fill < LO ? 'すこし、少ない。' : 'すこし、多い。';
    bm.innerHTML = ['……', 'うすい', 'まずまず', '悪くない', '香りが、立った'][score];
    bb.textContent = 'カップに注いで出す';
    await new Promise(r => bb.onclick = r);
    bb.onclick = null; sh.classList.remove('on'); await sleep(350);
    done(score);
  });
}

// ── 鯉の餌やり。水面を押すと団子を投げる。金色の鯉は欲ばりで、よーしよーしで順番を守らせる ──
// 結果 {fed:[…], even, goldHog} を返す（fed[0] が金色の鯉）
const KOI = [
  {base:'#d6a943', spots:[['#f3d27a', .22, 0, .14]], scale:1.35, gold:true},          // 金色の錦鯉（ひときわ威厳がある）
  {base:'#f1ebe0', spots:[['#e0573a', .30, 0, .16], ['#e0573a', -.05, .35, .13]]},      // 紅白
  {base:'#f1ebe0', spots:[['#e0573a', .10, -.2, .2]]},
  {base:'#f1ebe0', spots:[['#e0573a', .32, 0, .1], ['#e0573a', 0, -.25, .12], ['#e0573a', -.22, .15, .09]]},
  {base:'#5d5852', spots:[['#efe8da', .30, 0, .12], ['#efe8da', -.12, .2, .07]]},      // 墨
  {base:'#9fb0b8', spots:[['#e0573a', .08, .4, .1]]},                                   // 浅黄
  {base:'#e9e4da', spots:[['#2a2826', -.08, .25, .08], ['#2a2826', .2, -.3, .06]]},     // 白に墨
];
const DANGO = 14;
function koiGame(){
  const sh = $('#koi'), pond = $('#pond'), cv = pond.querySelector('canvas'), ctx = cv.getContext('2d');
  const km = $('#km'), kb = $('#kb'), kh = $('#kh'), kd = $('#kdots');
  clear(); sh.classList.add('on'); pond.classList.add('on');
  kh.classList.remove('book');
  kh.textContent = '水面を押すと、そこへ餌の団子を投げる。どの鯉にも、まんべんなく。';
  const DPR = Math.min(2, devicePixelRatio || 1);
  let W = 1, H = 1;
  const fit = () => {
    pond.style.bottom = sh.offsetHeight + 'px';
    const r = pond.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  };
  fit(); addEventListener('resize', fit);
  const unit = () => Math.min(W, H, 520);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const fish = KOI.map((k, i) => ({
    k, i, fed:0, x:rnd(.2, .8) * W, y:rnd(.15, .7) * H, a:rnd(0, 6.28), phase:rnd(0, 6), tx:0, ty:0, wt:0, eat:0, cool:0,
  }));
  const foods = [], rips = [];
  let left = DANGO, calm = 0, cd = 0, over = false, last = performance.now(), raf;

  kd.innerHTML = fish.map(f => `<i style="border-top:4px solid ${f.k.base}">0</i>`).join('');
  const dots = [...kd.children];
  const meter = () => km.innerHTML = `${left}<small>団子</small>`;
  meter(); kb.textContent = 'よーしよーし'; kb.disabled = false;

  const angTo = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
  const newTarget = f => { f.tx = rnd(.1, .9) * W; f.ty = rnd(.1, .85) * H; f.wt = rnd(2, 5); };
  fish.forEach(newTarget);

  pond.onpointerdown = e => {
    if (over || left <= 0) return;
    const r = pond.getBoundingClientRect();
    foods.push({x:e.clientX - r.left, y:e.clientY - r.top, t:0, sx:W / 2, sy:H + 20});
    left--; meter();
  };
  kb.onclick = () => {
    if (over || cd > 0) return;
    calm = 3; cd = 7;
    kh.textContent = '「よーしよーし、順番に食べるんだよ」'; kh.classList.add('book');
  };

  // 背骨にそって体を描く（頭が +x）
  function drawKoi(f){
    const L = unit() * .2 * (f.k.scale || 1), n = 12, amp = L * (f.chase ? .1 : .07);
    const sp = [];
    for (let i = 0; i <= n; i++){ const u = i / n; sp.push([L / 2 - u * L, Math.sin(f.phase - u * 3.2) * amp * u * u]); }
    const wd = u => L * .13 * (u < .3 ? .62 + u / .3 * .38 : 1 - Math.pow((u - .3) / .7, 1.5) * .86);
    const lf = [], rt = [];
    sp.forEach((p, i) => {
      const q = sp[Math.min(n, i + 1)], o = sp[Math.max(0, i - 1)];
      let dx = q[0] - o[0], dy = q[1] - o[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const w = wd(i / n); lf.push([p[0] - dy * w, p[1] + dx * w]); rt.push([p[0] + dy * w, p[1] - dx * w]);
    });
    const tail = sp[n], tw = Math.sin(f.phase - 3.2) * .5;
    const body = () => {
      ctx.beginPath(); ctx.moveTo(L / 2 + L * .02, 0);
      lf.forEach(p => ctx.lineTo(p[0], p[1]));
      rt.slice().reverse().forEach(p => ctx.lineTo(p[0], p[1]));
      ctx.closePath();
    };
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
    // 尾びれと胸びれ（半透明）
    ctx.fillStyle = f.k.base; ctx.globalAlpha = .55;
    ctx.beginPath(); ctx.moveTo(tail[0] + L * .04, tail[1]);
    ctx.quadraticCurveTo(tail[0] - L * .12, tail[1] - L * (.14 + tw * .05), tail[0] - L * .2, tail[1] - L * .12 + tw * L * .06);
    ctx.quadraticCurveTo(tail[0] - L * .1, tail[1], tail[0] - L * .2, tail[1] + L * .12 + tw * L * .06);
    ctx.quadraticCurveTo(tail[0] - L * .12, tail[1] + L * (.14 - tw * .05), tail[0] + L * .04, tail[1]);
    ctx.fill();
    const fp = lf[3], fq = rt[3], fl = Math.sin(f.phase * 1.3) * .3;
    ctx.beginPath(); ctx.ellipse(fp[0] - L * .04, fp[1] + L * .05, L * .07, L * .035, .9 + fl, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(fq[0] - L * .04, fq[1] - L * .05, L * .07, L * .035, -.9 - fl, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    // 体（水底に落ちる影つき）
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = L * .12; ctx.shadowOffsetX = L * .05; ctx.shadowOffsetY = L * .09;
    ctx.fillStyle = f.k.base; body(); ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.save(); body(); ctx.clip();
    f.k.spots.forEach(([c, sx, sy, r]) => {
      const u = .5 - sx, w = wd(Math.min(1, Math.max(0, u)));
      ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(sx * L, sy * w + (sp[Math.round(u * n)] || [0, 0])[1], r * L * 1.3, r * L, 0, 0, 7); ctx.fill();
    });
    // 背の光
    const g = ctx.createLinearGradient(0, -L * .13, 0, L * .13);
    g.addColorStop(0, 'rgba(0,0,0,.25)'); g.addColorStop(.5, 'rgba(255,255,255,.12)'); g.addColorStop(1, 'rgba(0,0,0,.25)');
    ctx.fillStyle = g; ctx.fillRect(-L, -L, 2 * L, 2 * L);
    ctx.restore();
    // 目と口
    ctx.fillStyle = '#1a1714';
    const ew = wd(.08) * .6;
    ctx.beginPath(); ctx.arc(L * .4, ew, L * .015, 0, 7); ctx.arc(L * .4, -ew, L * .015, 0, 7); ctx.fill();
    if (f.eat > 0){ ctx.beginPath(); ctx.ellipse(L * .5, 0, L * .03, L * .045, 0, 0, 7); ctx.fill(); }
    ctx.restore();
  }

  const loop = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    calm = Math.max(0, calm - dt); cd = Math.max(0, cd - dt);
    kb.disabled = over ? false : cd > 0;
    if (!over) kb.textContent = cd > 0 ? `よーしよーし（${Math.ceil(cd)}）` : 'よーしよーし';
    const U = unit();
    const minFed = Math.min(...fish.map(f => f.fed));
    // 餌：投げる → 着水 → 5秒で沈む
    for (let j = foods.length - 1; j >= 0; j--){
      const d = foods[j]; d.t += dt;
      if (d.t > .35 && !d.landed){ d.landed = true; rips.push({x:d.x, y:d.y, t:0}); }
      if (d.t > 5.35){ foods.splice(j, 1); }
    }
    fish.forEach(f => {
      f.eat = Math.max(0, f.eat - dt); f.cool = Math.max(0, f.cool - dt);
      // よーしよーしの間は、いちばん食べていない鯉だけが寄ってくる
      const may = f.cool <= 0 && (calm <= 0 || f.fed <= minFed);
      let tgt = null, best = Infinity;
      if (may) foods.forEach(d => {
        if (!d.landed) return;
        const dist = Math.hypot(d.x - f.x, d.y - f.y);
        if ((f.k.gold || dist < U * .55) && dist < best){ best = dist; tgt = d; }
      });
      f.chase = !!tgt;
      if (tgt){ f.tx = tgt.x; f.ty = tgt.y; }
      else { f.wt -= dt; if (f.wt <= 0 || Math.hypot(f.tx - f.x, f.ty - f.y) < U * .08) newTarget(f); }
      const L = U * .2 * (f.k.scale || 1);
      let v = f.chase ? L * 1.6 * (f.k.gold ? 1.3 : 1) : L * .45;
      if (calm > 0 && !f.chase) v *= .4;
      const turn = (f.chase ? 3.6 : 1.8) * dt;
      f.a += Math.max(-turn, Math.min(turn, angTo(f.a, Math.atan2(f.ty - f.y, f.tx - f.x))));
      f.x += Math.cos(f.a) * v * dt; f.y += Math.sin(f.a) * v * dt;
      f.x = Math.max(-L * .2, Math.min(W + L * .2, f.x)); f.y = Math.max(-L * .2, Math.min(H + L * .2, f.y));
      f.phase += dt * (f.chase ? 9 : 4);
      // 口が団子にとどいたら食べる
      if (tgt){
        const hx = f.x + Math.cos(f.a) * L * .5, hy = f.y + Math.sin(f.a) * L * .5;
        if (Math.hypot(tgt.x - hx, tgt.y - hy) < L * .22){
          foods.splice(foods.indexOf(tgt), 1); f.fed++; f.eat = .45; f.cool = f.k.gold ? .3 : .8;
          rips.push({x:tgt.x, y:tgt.y, t:0, small:true});
          dots[f.i].textContent = f.fed; dots[f.i].classList.add('ok');
        }
      }
    });
    // 描く
    ctx.clearRect(0, 0, W, H);
    rips.forEach(r => r.t += dt);
    for (let j = rips.length - 1; j >= 0; j--) if (rips[j].t > 1.4) rips.splice(j, 1);
    ctx.lineWidth = 1.2;
    rips.forEach(r => {
      const p = r.t / 1.4;
      ctx.strokeStyle = `rgba(239,232,218,${(1 - p) * .5})`;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, (r.small ? 14 : 24) + p * U * .12, ((r.small ? 14 : 24) + p * U * .12) * .55, 0, 0, 7); ctx.stroke();
    });
    foods.forEach(d => {
      if (!d.landed){
        const p = d.t / .35, x = d.sx + (d.x - d.sx) * p, y = d.sy + (d.y - d.sy) * p - Math.sin(Math.PI * p) * H * .18;
        ctx.fillStyle = '#c9b48f'; ctx.beginPath(); ctx.arc(x, y, U * .018 * (1.6 - p * .6), 0, 7); ctx.fill();
      } else {
        const s = Math.min(1, (d.t - .35) / 5);
        ctx.fillStyle = `rgba(201,180,143,${1 - s * .8})`; ctx.beginPath(); ctx.arc(d.x, d.y, U * .016 * (1 - s * .4), 0, 7); ctx.fill();
      }
    });
    fish.slice().sort((p, q) => (p.k.gold ? 1 : 0) - (q.k.gold ? 1 : 0)).forEach(drawKoi);   // 金色の鯉はいちばん上
    if (!over && left <= 0 && foods.length === 0) finish();
    raf = requestAnimationFrame(loop);
  };
  let done;
  const result = new Promise(r => done = r);
  function finish(){
    over = true; pond.onpointerdown = null;
    const fed = fish.map(f => f.fed), mn = Math.min(...fed), mx = Math.max(...fed);
    const even = mn >= 1 && mx - mn <= 1, goldHog = fed[0] === mx && mx - mn >= 2;
    kh.classList.remove('book');
    kh.textContent = even ? 'どの鯉も、ちゃんと食べた。' : goldHog ? '金色の鯉ばかりが、よく食べた。' : mn === 0 ? 'まだ口をあけている鯉がいる。' : 'すこし、かたよった。';
    kb.textContent = '池をあとにする';
    kb.onclick = () => {
      cancelAnimationFrame(raf); removeEventListener('resize', fit);
      sh.classList.remove('on'); pond.classList.remove('on');
      setTimeout(() => done({fed, even, goldHog}), 350);
    };
  }
  raf = requestAnimationFrame(loop);
  return result;
}

// ── 紙皿に盛る ──
function feed(){
  const sh = $('#feed'), fb = $('#fb'), items = [...sh.querySelectorAll('.items button')];
  clear(); items.forEach(b => b.classList.remove('on')); fb.disabled = true; sh.classList.add('on');
  return new Promise(res => {
    items.forEach(b => b.onclick = () => { b.classList.toggle('on'); fb.disabled = !items.every(x => x.classList.contains('on')); });
    fb.onclick = () => { sh.classList.remove('on'); setTimeout(res, 350); };
  });
}

// ── なでる ──
function pet(need = 6){
  const p = $('#pet'); p.classList.add('on'); let n = 0, lastT = 0;
  return new Promise(res => {
    const hit = (e, isMove) => {
      const now = performance.now(); if (isMove && now - lastT < 160) return; lastT = now;   // なでる動きだけ間引く。タップは毎回数える
      const r = p.getBoundingClientRect(), g = document.createElement('span');
      g.className = 'goro'; g.textContent = n % 2 ? 'ゴロ' : 'ゴロゴロ';
      g.style.left = (e.clientX - r.left) + 'px'; g.style.top = (e.clientY - r.top) + 'px';
      p.appendChild(g); setTimeout(() => g.remove(), 1400);
      if (++n >= need){ p.onpointerdown = p.onpointermove = null; setTimeout(() => { p.classList.remove('on'); res(); }, 900); }
    };
    p.onpointerdown = e => hit(e, false);
    p.onpointermove = e => { if (e.buttons || e.pointerType === 'touch') hit(e, true); };
  });
}
