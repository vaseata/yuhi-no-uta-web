<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>黄色いテントの喫茶店</title>
<!--
  『夕日の歌』の世界で遊ぶ1画面の試作（案A・2026-10-21）。
  朝の鎌倉山での鯉の餌やり、開店から夜の閉店まで、喫茶店の一日をすごし、最後に路地でおにゃんどんに出会う。
  追浜の車両集積所（車を指定の場所へ。2026-11-13）は冬の別の日なので、地図から単独で遊ぶ。
  台詞と地の文のうち b:1 の行は本文そのまま（校了PDF 261013_aSongForDusk.pdf の表記で照合済み）。
  ?mark を付けて開くと、本文の行に朱の点が付く（著者・藤沢さんの確認用）。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e0d0c; --paper:#efe8da; --dim:#a39c90; --shu:#ED6D46; --shu-deep:#c8432a;
  --box:rgba(14,13,12,.86); --line:rgba(239,232,218,.22);
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --klee:"Klee One","Hiragino Maru Gothic ProN",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:var(--mincho);
  -webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none;
  touch-action:manipulation;-webkit-text-size-adjust:100%}   /* スマホ：すばやく2回押しても拡大しない */
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#app{position:fixed;inset:0;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}   /* 長押しで文字選択や拡大鏡を出さない */
button{touch-action:manipulation;-webkit-touch-callout:none}

/* 絵（ぼかした地＋全体が見える絵）と、時刻の色 */
#scene{position:absolute;inset:0;isolation:isolate;overflow:hidden}
#bg{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(28px) brightness(.45);transition:background-image .8s}
#pic{position:absolute;left:0;right:0;top:48px;bottom:var(--boxh,34vh);margin:auto;width:100%;height:calc(100% - 48px - var(--boxh,34vh));
  object-fit:contain;transition:opacity .8s}
#pic.out{opacity:0}
#tint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2.4s ease,background 2.4s ease}
#tint.asa {opacity:.5; background:linear-gradient(180deg,#9fb3c8,#e9dcc4);mix-blend-mode:soft-light}
#tint.hiru{opacity:.35;background:linear-gradient(180deg,#e8d2ad,#bfa27a);mix-blend-mode:soft-light}
#tint.yu  {opacity:.62;background:linear-gradient(180deg,#ED6D46 0%,#f2a35c 48%,#6b2a1a 100%);mix-blend-mode:color}
#tint.yoru{opacity:.5; background:linear-gradient(180deg,#0d1b3a,#1e2a4a);mix-blend-mode:color}
#glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2.4s;
  background:radial-gradient(60% 50% at 50% 38%,rgba(237,109,70,.35),transparent 70%);mix-blend-mode:screen}
#glow.on{opacity:1}

/* 上の帯 */
#hud{position:relative;z-index:3;height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:linear-gradient(rgba(14,13,12,.8),rgba(14,13,12,0))}
#hud .yk{width:20px;height:20px;color:var(--shu);flex:none}
#hud .t{font-size:13px;letter-spacing:.12em;color:var(--dim)}
#clock{margin-left:auto;font-size:14px;letter-spacing:.14em}

/* 時刻の幕 */
#banner{position:absolute;z-index:4;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0;transition:opacity .9s}
#banner.on{opacity:1}
#banner b{display:block;font-weight:600;font-size:clamp(26px,5vw,40px);letter-spacing:.3em;text-shadow:0 2px 18px #000}
#banner small{display:block;margin-top:10px;font-size:13px;letter-spacing:.3em;color:var(--dim)}

/* ことばの箱 */
#box{position:absolute;z-index:3;left:0;right:0;bottom:0;height:var(--boxh,34vh);min-height:180px;
  padding:18px max(16px,calc(50% - 360px)) calc(18px + env(safe-area-inset-bottom));
  background:var(--box);border-top:1px solid var(--line);display:flex;flex-direction:column}
#who{min-height:1.4em;font-size:13px;letter-spacing:.2em;color:var(--shu);margin-bottom:8px}
#who.neko{font-family:var(--klee)}
#txt{font-size:clamp(16px,2.2vw,19px);line-height:1.95;letter-spacing:.04em;flex:1;overflow:auto}
#txt.neko{font-family:var(--klee)}
#txt.book::after{content:"";display:none}
.mark .book::before{content:"本文";font:10px var(--mincho);color:var(--shu);border:1px solid var(--shu);padding:0 4px;margin-right:8px;vertical-align:2px}
#next{position:absolute;right:max(20px,calc(50% - 340px));bottom:calc(14px + env(safe-area-inset-bottom));font-size:12px;color:var(--dim);
  animation:blink 1.4s infinite;opacity:0}
#next.on{opacity:1}
@keyframes blink{50%{opacity:.25}}
#choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
#choices button,.btn{display:block;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line);
  font-size:15px;letter-spacing:.06em;line-height:1.5;transition:border-color .2s,background .2s}
#choices button:hover,.btn:hover{border-color:var(--shu)}
#choices button.act{border-color:var(--shu);color:var(--paper)}
#choices button.act::before{content:"▸ ";color:var(--shu)}

/* 下から出る板（コーヒー・紙皿） */
.sheet{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:18px max(16px,calc(50% - 360px)) calc(20px + env(safe-area-inset-bottom));
  background:#161412;border-top:1px solid var(--shu);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet h3{font-weight:600;font-size:15px;letter-spacing:.2em;color:var(--shu);margin-bottom:4px}
.sheet .hint{font-size:13px;color:var(--dim);line-height:1.8;margin-bottom:12px;min-height:1.8em}
.sheet .row{display:flex;align-items:center;gap:18px}
.sheet svg{flex:none;width:120px;height:120px}
.sheet .ctl{flex:1;display:flex;flex-direction:column;gap:10px}
.big{padding:14px 16px;border:1px solid var(--shu);background:rgba(237,109,70,.08);font-size:16px;letter-spacing:.12em;text-align:center;touch-action:none}
.big:active,.big.down{background:rgba(237,109,70,.28)}
.big[disabled]{opacity:.35;pointer-events:none}
.meter{font-size:28px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.meter small{font-size:13px;color:var(--dim);margin-left:6px}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps i{flex:1;height:2px;background:var(--line)}
.steps i.on{background:var(--shu)}

#feed .items{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
#feed .items button{padding:12px;border:1px solid var(--line);font-size:15px;text-align:left}
#feed .items button.on{border-color:var(--shu);background:rgba(237,109,70,.12)}
#feed .items button.on::after{content:"　✓";color:var(--shu)}

/* 鯉の池（鎌倉山の庭の絵を暗く敷き、その上に鯉を描く） */
#pond{position:absolute;z-index:4;left:0;right:0;top:48px;bottom:220px;display:none;overflow:hidden;touch-action:none;cursor:crosshair}
#pond.on{display:block}
#pond::before{content:"";position:absolute;inset:-12px;background:url(assets/img007.jpg) center 80%/cover;filter:brightness(.42) contrast(1.15) blur(2px)}
#pond canvas{position:absolute;inset:0;width:100%;height:100%}
.kd{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.kd i{width:30px;height:30px;border:1px solid var(--line);display:grid;place-items:center;font:12px var(--mincho);font-style:normal;color:var(--dim);transition:color .3s}
.kd i.ok{color:var(--paper)}
.krow{display:flex;align-items:center;gap:16px}
.krow .big{flex:1}
.krow .meter{min-width:5.5em}

/* 追浜の車両集積所（上から見た絵を canvas に描く） */
#yard{position:absolute;z-index:2;left:0;right:0;top:48px;bottom:0;display:none;overflow:hidden;touch-action:none;background:#2e3338}
#yard.on{display:block}
#yard canvas{position:absolute;inset:0;width:100%;height:100%}
.slip{display:inline-flex;gap:12px;align-items:baseline;background:#f3ecdc;color:#1a1714;padding:6px 16px;font-family:var(--klee);transform:rotate(-1.2deg);margin-bottom:8px}
.slip small{font-size:11px;color:#6b6157;letter-spacing:.1em}
.slip b{font-size:20px;letter-spacing:.08em;font-weight:400}
.drow{display:flex;gap:10px}
.drow .dk{flex:none;width:68px;font-size:20px;padding:16px 0}
.drow #dgo{flex:1;padding:16px}
.drow2{display:flex;gap:10px;margin-top:10px}
.drow2 .btn{text-align:center;padding:9px 8px;font-size:14px}
.btn[disabled]{opacity:.35;pointer-events:none}
#dpark:not([disabled]){border-color:var(--shu);background:rgba(237,109,70,.14)}

/* 大楠山の沢で砂金採り（canvas に沢・フルイ網・パンニング皿・陶器を描く） */
#kawa{position:absolute;z-index:2;left:0;right:0;top:48px;bottom:0;display:none;overflow:hidden;touch-action:none;background:#1c1f1a}
#kawa.on{display:block}
#kawa canvas{position:absolute;inset:0;width:100%;height:100%}

/* 夜のイカ釣り（三崎港・城ヶ島） */
#umi{position:absolute;z-index:2;left:0;right:0;top:48px;bottom:0;display:none;overflow:hidden;touch-action:none;background:#0b1220}
#umi.on{display:block}
#umi canvas{position:absolute;inset:0;width:100%;height:100%}
#ib.atari{background:rgba(237,109,70,.45);animation:atari .18s 4 alternate}
@keyframes atari{to{transform:translateX(3px)}}
#ika .drow2 .btn{flex:1}
#ika [hidden]{display:none!important}
#ika .drow2 #il,#ika .drow2 #ir{flex:none;width:64px}

/* ベントレーで逃げる（城ヶ島から三崎の海へ。上から見た道を canvas に描く） */
#michi{position:absolute;z-index:2;left:0;right:0;top:48px;bottom:0;display:none;overflow:hidden;touch-action:none;background:#2c3a44}
#michi.on{display:block}
#michi canvas{position:absolute;inset:0;width:100%;height:100%}
#chase [hidden]{display:none!important}
.drow #cgo{flex:1;padding:16px}

/* なでる */
#pet{position:absolute;z-index:4;inset:48px 0 var(--boxh,34vh) 0;display:none;cursor:pointer;touch-action:none}
#pet.on{display:block}
.goro{position:absolute;font-family:var(--klee);color:var(--shu);font-size:18px;pointer-events:none;
  animation:goro 1.4s ease-out forwards;text-shadow:0 1px 6px #000}
@keyframes goro{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-160%)}}

/* はじめ・おわり */
.cover{position:absolute;z-index:8;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px 16px;background:rgba(14,13,12,.9);transition:opacity .8s}
.cover.hide{opacity:0;pointer-events:none}
.cover .from{font-size:12px;letter-spacing:.3em;color:var(--dim)}
.cover h1{font-weight:600;font-size:clamp(26px,6vw,44px);letter-spacing:.24em;margin:14px 0 6px}
.cover .lede{font-size:14px;line-height:2;color:var(--dim);margin:12px 0 26px}
.cover .big{min-width:220px}
.cover .yk{width:26px;height:26px;color:var(--shu);margin-bottom:12px}

#end{overflow:auto;justify-content:flex-start}
#end .card{width:min(420px,100%);margin:auto;background:#f3ecdc;color:#1a1714;padding:14px 14px 18px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#end .ph{position:relative;aspect-ratio:3/2;overflow:hidden;isolation:isolate}
#end .ph img{width:100%;height:100%;object-fit:cover;display:block}
#end .ph i{position:absolute;inset:0;background:linear-gradient(180deg,#ED6D46,#f2a35c 50%,#6b2a1a);mix-blend-mode:color;opacity:.6}
#end .cap{font-size:13px;letter-spacing:.1em;margin-top:12px;line-height:1.9;text-align:left}
#end .cap b{font-weight:600;font-size:15px}
#end .guests{font-size:12px;color:#6b6157}
#end .after{margin-top:22px;font-size:14px;line-height:2;color:var(--paper)}
#end .acts{display:flex;flex-direction:column;gap:10px;margin-top:16px;width:min(420px,100%)}
#end .acts .big{background:var(--shu-deep);border-color:var(--shu-deep);color:#fff;text-decoration:none}
#end .acts .btn{text-align:center}

/* はじめの地図 */
.mapscr{justify-content:flex-start;overflow:auto;padding:28px 16px calc(24px + env(safe-area-inset-bottom))}
.mhead{text-align:center;margin-bottom:20px}
.mhead .lede{margin:10px 0 0}
.mgrid{display:grid;gap:20px;width:min(980px,100%);align-items:start}
@media (min-width:820px){ .mgrid{grid-template-columns:1.1fr 1fr} }
.mapbox{position:relative;width:100%;max-width:560px;justify-self:center;background:#f3ecdc;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.mapbox svg{display:block;width:100%;height:auto}
.emap text{font-family:var(--mincho);fill:#3a332c}
.emap .sea{font-size:13px;letter-spacing:.5em;fill:#8a7f70}
.emap .nm{font-size:15px;font-weight:600;letter-spacing:.14em}
.emap .sm{font-size:11px;letter-spacing:.12em;fill:#8a7f70}
.spot{cursor:pointer}
.spot .ring{fill:#fbf6ea;stroke:#3a332c;stroke-width:1.4;transition:stroke .2s,stroke-width .2s}
.spot.on .ring,.spot:hover .ring{stroke:#ED6D46;stroke-width:3}
.spot .halo{fill:none;stroke:#ED6D46;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:halo 2.4s infinite}
@keyframes halo{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
.spot.soon{opacity:.45}
.spot.soon .halo{display:none}
.spot.st.soon{opacity:1}
.spot.st.soon .nm{fill:#8a7f70}
.mside{display:flex;flex-direction:column;gap:12px;text-align:left}
.mside .note{font-size:12px;color:var(--dim);text-align:center;margin-top:-4px}
.place{border:1px solid var(--line);padding:14px 16px;transition:border-color .2s;scroll-margin:16px}
.place.on{border-color:var(--shu)}
.place .no{font-size:11px;color:var(--shu);letter-spacing:.2em}
.place h2{font-weight:600;font-size:17px;letter-spacing:.12em;margin:2px 0 6px}
.place p{font-size:13px;color:var(--dim);line-height:1.8}
.place .gm{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.place .gm button{padding:9px 14px;border:1px solid var(--shu);font-size:14px;letter-spacing:.08em}
.place .gm button:hover{background:rgba(237,109,70,.12)}
.place .gm button.done::after{content:"　✓";color:var(--shu)}
.place .soon{display:inline-block;margin-top:10px;font-size:12px;color:var(--dim);border:1px dashed var(--line);padding:5px 10px;letter-spacing:.1em}
.mattr{font-size:10px;color:var(--dim);margin-top:16px}
.mattr a{color:inherit}
#tomap{margin-left:14px;font-size:12px;letter-spacing:.12em;border:1px solid var(--line);padding:4px 10px;color:var(--dim)}

@media (min-width:900px){ :root{--boxh:30vh} }
/* スマホ（読者の7割）。親指で押しやすい大きさに、板は低めにして絵を広く */
@media (max-width:600px){
  .sheet{padding-top:12px}
  .sheet h3{font-size:14px;margin-bottom:2px}
  .sheet .hint{font-size:12.5px;line-height:1.7;margin-bottom:8px}
  .big{min-height:60px;font-size:17px}
  .drow .dk{width:72px;font-size:22px}
  .drow2 .btn{min-height:46px}
  #choices button{padding:13px 14px;font-size:16px}
  .meter{font-size:24px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="app">
  <div id="scene">
    <div id="bg"></div>
    <img id="pic" alt="">
    <div id="glow"></div>
    <div id="tint"></div>
  </div>

  <header id="hud">
    <svg class="yk" aria-hidden="true"><use href="#yk"/></svg>
    <span class="t" id="place">黄色いテントの喫茶店</span>
    <span id="clock"></span>
    <button id="tomap" type="button">地図</button>
  </header>

  <div id="banner"><b></b><small></small></div>
  <div id="pet" aria-label="おにゃんどんをなでる"></div>
  <div id="pond" aria-label="鯉の池。押したところへ餌を投げる"><canvas></canvas></div>

  <div id="yard" aria-label="追浜の車両集積所"><canvas></canvas></div>
  <div id="kawa" aria-label="大楠山の沢"><canvas></canvas></div>
  <div id="umi" aria-label="夜の海"><canvas></canvas></div>
  <div id="michi" aria-label="城ヶ島と三崎の道"><canvas></canvas></div>

  <section id="box" aria-live="polite">
    <div id="who"></div>
    <div id="txt"></div>
    <div id="choices"></div>
    <div id="next">▼</div>
  </section>

  <!-- コーヒーを淹れる -->
  <section id="brew" class="sheet" aria-label="コーヒーを淹れる">
    <div class="steps"><i></i><i></i><i></i></div>
    <h3 id="bt"></h3>
    <p class="hint" id="bh"></p>
    <div class="row">
      <svg viewBox="0 0 120 120" id="bsvg" aria-hidden="true"></svg>
      <div class="ctl">
        <div class="meter" id="bm"></div>
        <button class="big" id="bb"></button>
      </div>
    </div>
  </section>

  <!-- 鯉の餌やり -->
  <section id="koi" class="sheet" aria-label="鯉の餌やり">
    <h3>鯉の餌やり</h3>
    <p class="hint" id="kh"></p>
    <div class="kd" id="kdots"></div>
    <div class="krow">
      <div class="meter" id="km"></div>
      <button class="big" id="kb">よーしよーし</button>
    </div>
  </section>

  <!-- 車を指定の場所へ -->
  <section id="drive" class="sheet" aria-label="車を指定の場所へ">
    <div class="slip"><small>紙切れ</small><b id="dslip"></b></div>
    <p class="hint" id="dh"></p>
    <div class="drow">
      <button class="big dk" id="dl" type="button" aria-label="ハンドルを左へ">◀</button>
      <button class="big dk" id="dr" type="button" aria-label="ハンドルを右へ">▶</button>
      <button class="big" id="dgo" type="button">アクセル</button>
    </div>
    <div class="drow2">
      <button class="btn" id="dpark" type="button" disabled>ここに停める</button>
      <button class="btn" id="dhand" type="button">右手を上げる</button>
    </div>
  </section>

  <!-- 砂金採り -->
  <section id="pan" class="sheet" aria-label="砂金採り">
    <div class="steps"><i></i><i></i><i></i><i></i></div>
    <h3 id="pt"></h3>
    <p class="hint" id="pn"></p>
    <div class="krow">
      <div class="meter" id="pm"></div>
      <button class="big" id="pb" type="button"></button>
    </div>
  </section>

  <!-- 夜のイカ釣り -->
  <section id="ika" class="sheet" aria-label="夜のイカ釣り">
    <h3 id="it"></h3>
    <p class="hint" id="ih"></p>
    <div class="krow">
      <div class="meter" id="im"></div>
      <button class="big" id="ib" type="button"></button>
    </div>
    <div class="drow2">
      <button class="btn" id="il" type="button" aria-label="左へ">◀</button>
      <button class="btn" id="ix" type="button">巻いて回収</button>
      <button class="btn" id="ir" type="button" aria-label="右へ">▶</button>
    </div>
  </section>

  <!-- ベントレーで逃げる -->
  <section id="chase" class="sheet" aria-label="ベントレーで逃げる">
    <h3 id="ct"></h3>
    <p class="hint" id="ch"></p>
    <div class="drow">
      <button class="big dk" id="cl" type="button" aria-label="ハンドルを左へ">◀</button>
      <button class="big dk" id="cr" type="button" aria-label="ハンドルを右へ">▶</button>
      <button class="big" id="cgo" type="button">アクセル</button>
    </div>
  </section>

  <!-- 紙皿に盛る -->
  <section id="feed" class="sheet" aria-label="紙皿に盛る">
    <h3>紙皿に盛る</h3>
    <p class="hint">ぜんぶ選んだら、おにゃんどんの前に置く。</p>
    <div class="items">
      <button data-k="pan">冷凍のパンを牛乳にしたす</button>

<script>
(() => {
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
if (new URLSearchParams(location.search).has('mark')) document.body.classList.add('mark');

// ── 場面 ─────────────────────────────
const SCENES = {
  koi:  {img:'img007.jpg', tint:'asa',  clock:'午前八時',   label:'鯉の餌やり', sub:'鎌倉山・午前八時', place:'鎌倉山・御代川邸'},
  koi2: {img:'img008.jpg', tint:'asa',  clock:'午前八時', place:'鎌倉山・御代川邸'},
  asa: {img:'img015.jpg', tint:'asa',  clock:'午前十時',   label:'開店',     sub:'朝十時'},
  beer: {img:'img021.jpg', tint:'asa',  clock:'午前十時'},
  hiru: {img:'img028.jpg', tint:'hiru', clock:'午後二時',   label:'昼下がり', sub:'午後二時'},
  yu:   {img:'img025.jpg', tint:'yu',   clock:'午後五時',   label:'夕暮れ',   sub:'午後五時', glow:true},
  yoru: {img:'img024.jpg', tint:'yoru', clock:'午後九時',   label:'閉店',     sub:'夜九時'},
};
async function scene(key, withBanner = true){
  const s = SCENES[key], pic = $('#pic');
  pic.classList.add('out'); await sleep(450);
  pic.src = 'assets/' + s.img;
  $('#bg').style.backgroundImage = `url(assets/${s.img})`;
  $('#tint').className = s.tint;
  $('#glow').classList.toggle('on', !!s.glow);
  $('#clock').textContent = s.clock;
  $('#place').textContent = s.place || '黄色いテントの喫茶店';
  pic.onload = () => pic.classList.remove('out');
  if (pic.complete) pic.classList.remove('out');
  if (withBanner && s.label){
    $('#banner b').textContent = s.label; $('#banner small').textContent = s.sub;
    clear(); $('#banner').classList.add('on'); await sleep(1700); $('#banner').classList.remove('on'); await sleep(500);
  }
}

// ── ことば ───────────────────────────
let advance = null, typing = null;
function clear(){ $('#who').textContent=''; $('#txt').textContent=''; $('#choices').innerHTML=''; $('#next').classList.remove('on'); }
// say(誰, 文, 本文なら true)。誰が null なら地の文。
function say(who, text, book = false){
  clear();
  const neko = who === 'おにゃんどん' || who === '？';
  $('#who').textContent = who || ''; $('#who').className = neko ? 'neko' : '';
  const t = $('#txt'); t.className = (neko ? 'neko ' : '') + (book ? 'book' : '');
  return new Promise(res => {
    let i = 0; const chars = [...text];
    typing = () => { i = chars.length; t.textContent = text; };
    const tick = () => {
      if (i >= chars.length){ typing = null; $('#next').classList.add('on'); advance = res; return; }
      t.textContent = chars.slice(0, ++i).join(''); setTimeout(tick, 34);
    };
    tick();
  });
}
const N = (text, book) => say(null, text, book);         // 地の文
function choose(opts){                                   // 選ぶ。押した番号を返す
  $('#next').classList.remove('on');
  return new Promise(res => {
    const box = $('#choices'); box.innerHTML = '';
    opts.forEach((o, i) => {
      const b = document.createElement('button'); b.textContent = o; b.className = o.startsWith('［') ? 'act' : '';
      b.onclick = e => { e.stopPropagation(); box.innerHTML = ''; res(i); };
      box.appendChild(b);
    });
  });
}
function step(){ if (typing){ typing(); return; } if (advance){ const r = advance; advance = null; r(); } }
$('#box').addEventListener('click', step);
$('#scene').addEventListener('click', step);
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); step(); } });

// ── コーヒーを淹れる（挽く → 蒸らす → 注ぐ）。0〜4 点を返す ──
function brew(){
  const sh = $('#brew'), svg = $('#bsvg'), bt = $('#bt'), bh = $('#bh'), bm = $('#bm'), bb = $('#bb');
  const steps = sh.querySelectorAll('.steps i');
  const setStep = n => steps.forEach((s, i) => s.classList.toggle('on', i < n));
  clear(); sh.classList.add('on');
  return new Promise(async done => {
    let score = 0;

    // 一　挽く
    setStep(1); bt.textContent = '一　豆を挽く';
    bh.textContent = 'ミルのハンドルを回す。';
    let turns = 0; const need = 8;
    const mill = a => svg.innerHTML =
      `<rect x="34" y="52" width="52" height="56" fill="none" stroke="#efe8da" stroke-width="2"/>
       <path d="M40 52 L46 30 H74 L80 52" fill="none" stroke="#efe8da" stroke-width="2"/>
       <g transform="rotate(${a} 60 30)"><line x1="60" y1="30" x2="60" y2="8" stroke="#ED6D46" stroke-width="3"/><circle cx="60" cy="8" r="5" fill="#ED6D46"/></g>
       <rect x="40" y="${104 - turns * 5}" width="40" height="${turns * 5}" fill="#6b4a33"/>`;
    mill(0); bm.innerHTML = `0<small>/ ${need}</small>`; bb.textContent = 'ハンドルを回す'; bb.disabled = false;
    await new Promise(r => { bb.onclick = () => {
      turns++; mill(turns * 135); bm.innerHTML = `${turns}<small>/ ${need}</small>`;
      if (turns >= need){ bb.onclick = null; r(); }
    }; });
    await sleep(300);

    // 二　蒸らす（画面の 1 秒が 10 秒）
    setStep(2); bt.textContent = '二　蒸らす';
    bh.textContent = 'お湯を少しだけ入れて四十秒蒸らした。';
    bh.classList.add('book');
    const drip = r => svg.innerHTML =
      `<path d="M28 34 H92 L68 78 H52 Z" fill="none" stroke="#efe8da" stroke-width="2"/>
       <ellipse cx="60" cy="${40 - r * 8}" rx="${26 + r * 2}" ry="${6 + r * 9}" fill="#6b4a33" opacity=".9"/>
       <rect x="40" y="86" width="40" height="26" fill="none" stroke="#efe8da" stroke-width="2"/>`;
    drip(0); bm.innerHTML = `0<small>秒</small>`; bb.textContent = 'お湯を少しだけ入れる';
    await new Promise(r => bb.onclick = r);
    bb.textContent = 'ここで注ぎはじめる';
    const secs = await new Promise(r => {
      const t0 = performance.now(); let raf;
      const loop = now => {
        const s = Math.min(60, (now - t0) / 100);
        drip(Math.min(1, s / 40)); bm.innerHTML = `${Math.floor(s)}<small>秒</small>`;
        if (s >= 60){ bb.onclick = null; r(60); return; }
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
      bb.onclick = () => { cancelAnimationFrame(raf); bb.onclick = null; r((performance.now() - t0) / 100); };
    });
    const d = Math.abs(secs - 40);
    score += d <= 4 ? 2 : d <= 10 ? 1 : 0;
    bh.classList.remove('book');
    bh.textContent = d <= 4 ? '粉が、ふっくらと膨らんだ。' : secs < 40 ? 'すこし、早かったかもしれない。' : '蒸らしすぎたかもしれない。';
    await sleep(1100);

    // 三　注ぐ（押しているあいだ注ぐ。二杯分の線で止める）
    setStep(3); bt.textContent = '三　注ぐ';
    bh.textContent = 'そしてお湯を一定の速度で中央に垂らした。';
    bh.classList.add('book');
    const LO = 70, HI = 82;
    const server = (f, pouring) => svg.innerHTML =
      `${pouring ? '<line x1="60" y1="0" x2="60" y2="30" stroke="#efe8da" stroke-width="2" opacity=".7"/>' : ''}
       <path d="M30 30 V108 H90 V30" fill="none" stroke="#efe8da" stroke-width="2"/>
       <rect x="32" y="${108 - f * .78}" width="56" height="${f * .78}" fill="#5a3a24"/>
       <line x1="26" y1="${108 - LO * .78}" x2="94" y2="${108 - LO * .78}" stroke="#ED6D46" stroke-dasharray="3 3"/>
       <line x1="26" y1="${108 - HI * .78}" x2="94" y2="${108 - HI * .78}" stroke="#ED6D46" stroke-dasharray="3 3"/>
       <text x="96" y="${108 - (LO + HI) / 2 * .78 + 4}" fill="#ED6D46" font-size="9">二杯</text>`;
    let fill = 0; server(0); bm.innerHTML = `0<small>％</small>`; bb.textContent = '押しているあいだ注ぐ';
    fill = await new Promise(r => {
      let raf, last, on = false;
      const loop = now => {
        fill = Math.min(100, fill + (now - last) / 1000 * 24); last = now;
        server(fill, true); bm.innerHTML = `${Math.floor(fill)}<small>％</small>`;
        if (fill >= 100){ stop(); return; }
        raf = requestAnimationFrame(loop);
      };
      const start = e => { e.preventDefault(); if (on) return; on = true; bb.classList.add('down'); last = performance.now(); raf = requestAnimationFrame(loop); };
      const stop = () => { if (!on) return; on = false; bb.classList.remove('down'); cancelAnimationFrame(raf); server(fill);
        bb.onpointerdown = bb.onpointerup = bb.onpointerleave = bb.onpointercancel = null; r(fill); };
      bb.onclick = null;
      bb.onpointerdown = start; bb.onpointerup = bb.onpointerleave = bb.onpointercancel = stop;
    });
    bh.classList.remove('book');
    const inBand = fill >= LO && fill <= HI;
    score += inBand ? 2 : (fill >= LO - 12 && fill < 100) ? 1 : 0;
    bh.textContent = fill >= 100 ? 'あふれてしまった。' : inBand ? 'ちょうど、二杯分。' : fill < LO ? 'すこし、少ない。' : 'すこし、多い。';
    bm.innerHTML = ['……', 'うすい', 'まずまず', '悪くない', '香りが、立った'][score];
    bb.textContent = 'カップに注いで出す';
    await new Promise(r => bb.onclick = r);
    bb.onclick = null; sh.classList.remove('on'); await sleep(350);
    done(score);
  });
}

// ── 鯉の餌やり。水面を押すと団子を投げる。金色の鯉は欲ばりで、よーしよーしで順番を守らせる ──
// 結果 {fed:[…], even, goldHog} を返す（fed[0] が金色の鯉）
const KOI = [
  {base:'#d6a943', spots:[['#f3d27a', .22, 0, .14]], scale:1.35, gold:true},          // 金色の錦鯉（ひときわ威厳がある）
  {base:'#f1ebe0', spots:[['#e0573a', .30, 0, .16], ['#e0573a', -.05, .35, .13]]},      // 紅白
  {base:'#f1ebe0', spots:[['#e0573a', .10, -.2, .2]]},
  {base:'#f1ebe0', spots:[['#e0573a', .32, 0, .1], ['#e0573a', 0, -.25, .12], ['#e0573a', -.22, .15, .09]]},
  {base:'#5d5852', spots:[['#efe8da', .30, 0, .12], ['#efe8da', -.12, .2, .07]]},      // 墨
  {base:'#9fb0b8', spots:[['#e0573a', .08, .4, .1]]},                                   // 浅黄
  {base:'#e9e4da', spots:[['#2a2826', -.08, .25, .08], ['#2a2826', .2, -.3, .06]]},     // 白に墨
];
const DANGO = 14;
function koiGame(){
  const sh = $('#koi'), pond = $('#pond'), cv = pond.querySelector('canvas'), ctx = cv.getContext('2d');
  const km = $('#km'), kb = $('#kb'), kh = $('#kh'), kd = $('#kdots');
  clear(); sh.classList.add('on'); pond.classList.add('on');
  kh.classList.remove('book');
  kh.textContent = '水面を押すと、そこへ餌の団子を投げる。どの鯉にも、まんべんなく。';
  const DPR = Math.min(2, devicePixelRatio || 1);
  let W = 1, H = 1;
  const fit = () => {
    pond.style.bottom = sh.offsetHeight + 'px';
    const r = pond.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  };
  fit(); addEventListener('resize', fit);
  const unit = () => Math.min(W, H, 520);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const fish = KOI.map((k, i) => ({
    k, i, fed:0, x:rnd(.2, .8) * W, y:rnd(.15, .7) * H, a:rnd(0, 6.28), phase:rnd(0, 6), tx:0, ty:0, wt:0, eat:0, cool:0,
  }));
  const foods = [], rips = [];
  let left = DANGO, calm = 0, cd = 0, over = false, last = performance.now(), raf;

  kd.innerHTML = fish.map(f => `<i style="border-top:4px solid ${f.k.base}">0</i>`).join('');
  const dots = [...kd.children];
  const meter = () => km.innerHTML = `${left}<small>団子</small>`;
  meter(); kb.textContent = 'よーしよーし'; kb.disabled = false;

  const angTo = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
  const newTarget = f => { f.tx = rnd(.1, .9) * W; f.ty = rnd(.1, .85) * H; f.wt = rnd(2, 5); };
  fish.forEach(newTarget);

  pond.onpointerdown = e => {
    if (over || left <= 0) return;
    const r = pond.getBoundingClientRect();
    foods.push({x:e.clientX - r.left, y:e.clientY - r.top, t:0, sx:W / 2, sy:H + 20});
    left--; meter();
  };
  kb.onclick = () => {
    if (over || cd > 0) return;
    calm = 3; cd = 7;
    kh.textContent = '「よーしよーし、順番に食べるんだよ」'; kh.classList.add('book');
  };

  // 背骨にそって体を描く（頭が +x）
  function drawKoi(f){
    const L = unit() * .2 * (f.k.scale || 1), n = 12, amp = L * (f.chase ? .1 : .07);
    const sp = [];
    for (let i = 0; i <= n; i++){ const u = i / n; sp.push([L / 2 - u * L, Math.sin(f.phase - u * 3.2) * amp * u * u]); }
    const wd = u => L * .13 * (u < .3 ? .62 + u / .3 * .38 : 1 - Math.pow((u - .3) / .7, 1.5) * .86);
    const lf = [], rt = [];
    sp.forEach((p, i) => {
      const q = sp[Math.min(n, i + 1)], o = sp[Math.max(0, i - 1)];
      let dx = q[0] - o[0], dy = q[1] - o[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const w = wd(i / n); lf.push([p[0] - dy * w, p[1] + dx * w]); rt.push([p[0] + dy * w, p[1] - dx * w]);
    });
    const tail = sp[n], tw = Math.sin(f.phase - 3.2) * .5;
    const body = () => {
      ctx.beginPath(); ctx.moveTo(L / 2 + L * .02, 0);
      lf.forEach(p => ctx.lineTo(p[0], p[1]));
      rt.slice().reverse().forEach(p => ctx.lineTo(p[0], p[1]));
      ctx.closePath();
    };
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
    // 尾びれと胸びれ（半透明）
    ctx.fillStyle = f.k.base; ctx.globalAlpha = .55;
    ctx.beginPath(); ctx.moveTo(tail[0] + L * .04, tail[1]);
    ctx.quadraticCurveTo(tail[0] - L * .12, tail[1] - L * (.14 + tw * .05), tail[0] - L * .2, tail[1] - L * .12 + tw * L * .06);
    ctx.quadraticCurveTo(tail[0] - L * .1, tail[1], tail[0] - L * .2, tail[1] + L * .12 + tw * L * .06);
    ctx.quadraticCurveTo(tail[0] - L * .12, tail[1] + L * (.14 - tw * .05), tail[0] + L * .04, tail[1]);
    ctx.fill();
    const fp = lf[3], fq = rt[3], fl = Math.sin(f.phase * 1.3) * .3;
    ctx.beginPath(); ctx.ellipse(fp[0] - L * .04, fp[1] + L * .05, L * .07, L * .035, .9 + fl, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(fq[0] - L * .04, fq[1] - L * .05, L * .07, L * .035, -.9 - fl, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    // 体（水底に落ちる影つき）
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = L * .12; ctx.shadowOffsetX = L * .05; ctx.shadowOffsetY = L * .09;
    ctx.fillStyle = f.k.base; body(); ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.save(); body(); ctx.clip();
    f.k.spots.forEach(([c, sx, sy, r]) => {
      const u = .5 - sx, w = wd(Math.min(1, Math.max(0, u)));
      ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(sx * L, sy * w + (sp[Math.round(u * n)] || [0, 0])[1], r * L * 1.3, r * L, 0, 0, 7); ctx.fill();
    });
    // 背の光
    const g = ctx.createLinearGradient(0, -L * .13, 0, L * .13);
    g.addColorStop(0, 'rgba(0,0,0,.25)'); g.addColorStop(.5, 'rgba(255,255,255,.12)'); g.addColorStop(1, 'rgba(0,0,0,.25)');
    ctx.fillStyle = g; ctx.fillRect(-L, -L, 2 * L, 2 * L);
    ctx.restore();
    // 目と口
    ctx.fillStyle = '#1a1714';
    const ew = wd(.08) * .6;
    ctx.beginPath(); ctx.arc(L * .4, ew, L * .015, 0, 7); ctx.arc(L * .4, -ew, L * .015, 0, 7); ctx.fill();
    if (f.eat > 0){ ctx.beginPath(); ctx.ellipse(L * .5, 0, L * .03, L * .045, 0, 0, 7); ctx.fill(); }
    ctx.restore();
  }

  const loop = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    calm = Math.max(0, calm - dt); cd = Math.max(0, cd - dt);
    kb.disabled = over ? false : cd > 0;
    if (!over) kb.textContent = cd > 0 ? `よーしよーし（${Math.ceil(cd)}）` : 'よーしよーし';
    const U = unit();
    const minFed = Math.min(...fish.map(f => f.fed));
    // 餌：投げる → 着水 → 5秒で沈む
    for (let j = foods.length - 1; j >= 0; j--){
      const d = foods[j]; d.t += dt;
      if (d.t > .35 && !d.landed){ d.landed = true; rips.push({x:d.x, y:d.y, t:0}); }
      if (d.t > 5.35){ foods.splice(j, 1); }
    }
    fish.forEach(f => {
      f.eat = Math.max(0, f.eat - dt); f.cool = Math.max(0, f.cool - dt);
      // よーしよーしの間は、いちばん食べていない鯉だけが寄ってくる
      const may = f.cool <= 0 && (calm <= 0 || f.fed <= minFed);
      let tgt = null, best = Infinity;
      if (may) foods.forEach(d => {
        if (!d.landed) return;
        const dist = Math.hypot(d.x - f.x, d.y - f.y);
        if ((f.k.gold || dist < U * .55) && dist < best){ best = dist; tgt = d; }
      });
      f.chase = !!tgt;
      if (tgt){ f.tx = tgt.x; f.ty = tgt.y; }
      else { f.wt -= dt; if (f.wt <= 0 || Math.hypot(f.tx - f.x, f.ty - f.y) < U * .08) newTarget(f); }
      const L = U * .2 * (f.k.scale || 1);
      let v = f.chase ? L * 1.6 * (f.k.gold ? 1.3 : 1) : L * .45;
      if (calm > 0 && !f.chase) v *= .4;
      const turn = (f.chase ? 3.6 : 1.8) * dt;
      f.a += Math.max(-turn, Math.min(turn, angTo(f.a, Math.atan2(f.ty - f.y, f.tx - f.x))));
      f.x += Math.cos(f.a) * v * dt; f.y += Math.sin(f.a) * v * dt;
      f.x = Math.max(-L * .2, Math.min(W + L * .2, f.x)); f.y = Math.max(-L * .2, Math.min(H + L * .2, f.y));
      f.phase += dt * (f.chase ? 9 : 4);
      // 口が団子にとどいたら食べる
      if (tgt){
        const hx = f.x + Math.cos(f.a) * L * .5, hy = f.y + Math.sin(f.a) * L * .5;
        if (Math.hypot(tgt.x - hx, tgt.y - hy) < L * .22){
          foods.splice(foods.indexOf(tgt), 1); f.fed++; f.eat = .45; f.cool = f.k.gold ? .3 : .8;
          rips.push({x:tgt.x, y:tgt.y, t:0, small:true});
          dots[f.i].textContent = f.fed; dots[f.i].classList.add('ok');
        }
      }
    });
    // 描く
    ctx.clearRect(0, 0, W, H);
    rips.forEach(r => r.t += dt);
    for (let j = rips.length - 1; j >= 0; j--) if (rips[j].t > 1.4) rips.splice(j, 1);
    ctx.lineWidth = 1.2;
    rips.forEach(r => {
      const p = r.t / 1.4;
      ctx.strokeStyle = `rgba(239,232,218,${(1 - p) * .5})`;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, (r.small ? 14 : 24) + p * U * .12, ((r.small ? 14 : 24) + p * U * .12) * .55, 0, 0, 7); ctx.stroke();
    });
    foods.forEach(d => {
      if (!d.landed){
        const p = d.t / .35, x = d.sx + (d.x - d.sx) * p, y = d.sy + (d.y - d.sy) * p - Math.sin(Math.PI * p) * H * .18;
        ctx.fillStyle = '#c9b48f'; ctx.beginPath(); ctx.arc(x, y, U * .018 * (1.6 - p * .6), 0, 7); ctx.fill();
      } else {
        const s = Math.min(1, (d.t - .35) / 5);
        ctx.fillStyle = `rgba(201,180,143,${1 - s * .8})`; ctx.beginPath(); ctx.arc(d.x, d.y, U * .016 * (1 - s * .4), 0, 7); ctx.fill();
      }
    });
    fish.slice().sort((p, q) => (p.k.gold ? 1 : 0) - (q.k.gold ? 1 : 0)).forEach(drawKoi);   // 金色の鯉はいちばん上
    if (!over && left <= 0 && foods.length === 0) finish();
    raf = requestAnimationFrame(loop);
  };
  let done;
  const result = new Promise(r => done = r);
  function finish(){
    over = true; pond.onpointerdown = null;
    const fed = fish.map(f => f.fed), mn = Math.min(...fed), mx = Math.max(...fed);
    const even = mn >= 1 && mx - mn <= 1, goldHog = fed[0] === mx && mx - mn >= 2;
    kh.classList.remove('book');
    kh.textContent = even ? 'どの鯉も、ちゃんと食べた。' : goldHog ? '金色の鯉ばかりが、よく食べた。' : mn === 0 ? 'まだ口をあけている鯉がいる。' : 'すこし、かたよった。';
    kb.textContent = '池をあとにする';
    kb.onclick = () => {
      cancelAnimationFrame(raf); removeEventListener('resize', fit);
      sh.classList.remove('on'); pond.classList.remove('on');
      setTimeout(() => done({fed, even, goldHog}), 350);
    };
  }
  raf = requestAnimationFrame(loop);
  return result;
}

// ── 追浜の車両集積所。紙切れの番号のレーンへ車を運び、前の車のすぐうしろに停める。バックは禁止 ──
// 上から見た絵。北（海のほう）が上。車は北向きにしか進めない（向きは左右およそ 60 度まで）。
// drive() は {ok, tonari, parked, hand, gap, bumps} を返す
function makeYard(){
  const el = $('#yard'), cv = el.querySelector('canvas'), ctx = cv.getContext('2d'), sh = $('#drive');
  const DPR = Math.min(2, devicePixelRatio || 1);
  const P = 38, S = 66, CL = 60, CW = 27, X0 = 80, NL = 16, WW = X0 * 2 + NL * P;   // レーンの幅・1台ぶんの長さ・車の大きさ
  const APR = 460, RX0 = 115, RX1 = 235, RXC = 175, SY = 1380, FILL = 16;                  // レーン手前の広場の奥行き・通路・出発点
  const E = [9, 12, 7, 11, 8, 13, 10, 11, 7, 12, 9, 13, 8, 11, 10, 12];                     // レーンごとの、手前の空きの台数
  const BASE = [31, 67, 12, 45, 78, 23, 60, 54, 39, 71, 18, 50, 83, 27, 64, 42];            // いちばん奥の空きが何台目か
  // 停めるレーン（TL）と台数目は、遊ぶたびにくじで決める（本文は２８００番台の五十四台目）。A の番号も
  const TL = Math.floor(Math.random() * NL), A0 = 1000 + Math.floor(Math.random() * 999);
  BASE[TL] = 10 + Math.floor(Math.random() * 75);
  const COLS = ['#e9e9e6', '#d5d7d8', '#e9e9e6', '#c3c6c9', '#e9e9e6', '#8f959b', '#dcdcd8', '#3d4247'];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let W = 1, H = 1, pad = 0, sc = 1, mode = 'idle', night = 0, nightTo = 0, raf = 0, last = 0, t = 0, white = 0, whiteTo = 0, hand = false, bumps = 0, hintNow = '', shake = 0, flash = 0, onScrape = null;
  const car = {x:RXC, y:SY, a:0, v:0, hidden:false};
  const key = {l:false, r:false, go:false};
  const sup = {on:false, y:0, to:0};
  const snow = Array.from({length:150}, () => ({x:Math.random(), y:Math.random(), v:.5 + Math.random() * .6, l:6 + Math.random() * 10}));
  const fit = () => {
    const r = el.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = W * DPR; cv.height = H * DPR;
    pad = (mode === 'drive' ? sh : $('#box')).offsetHeight;
    sc = clamp(W / 440, .8, 1.5);
  };
  const laneX = j => X0 + (j + .5) * P;
  const slotNo = (j, k) => BASE[j] + (E[j] - 1 - k);
  const zen = n => String(n).replace(/\d/g, d => '０１２３４５６７８９'[d]);

  // 通れないところ
  function solid(px, py){
    if (py > APR) return px < RX0 || px > RX1 || py > SY + 120;
    if (py >= 0) return px < 46 || px > WW - 46;
    const j = Math.floor((px - X0) / P); if (j < 0 || j >= NL) return true;
    const k = Math.floor(-py / S); if (k < E[j]) return false; if (k >= E[j] + FILL) return true;
    const ly = -py - k * S; return Math.abs(px - laneX(j)) <= CW / 2 && ly >= 3 && ly <= S - 3;
  }
  function blocked(x, y, a){
    const c = Math.cos(a), s = Math.sin(a);
    return [[-CW / 2, -CL / 2], [CW / 2, -CL / 2], [0, -CL / 2], [-CW / 2, CL / 2], [CW / 2, CL / 2], [-CW / 2, 0], [CW / 2, 0]]
      .some(([dx, dy]) => solid(x + dx * c - dy * s, y + dx * s + dy * c));
  }
  const laneOf = () => clamp(Math.floor((car.x - X0) / P), 0, NL - 1);
  const gapOf = j => (car.y - CL / 2) + E[j] * S + 3;

  function rr(x, y, w, h, r){
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  // 車（前が上）。snowy は屋根に雪、me は自分の車（ライトとブレーキランプ）
  function drawCar(x, y, a, col, o = {}){
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    if (o.me){
      const g = ctx.createLinearGradient(0, -CL / 2, 0, -CL / 2 - 130);
      g.addColorStop(0, `rgba(255,236,190,${.3 + night * .3})`); g.addColorStop(1, 'rgba(255,236,190,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-11, -CL / 2); ctx.lineTo(-34, -CL / 2 - 130); ctx.lineTo(34, -CL / 2 - 130); ctx.lineTo(11, -CL / 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(-CW / 2 + 3, -CL / 2 + 4, CW, CL, 7); ctx.fill();
    ctx.fillStyle = col; rr(-CW / 2, -CL / 2, CW, CL, 7); ctx.fill();
    ctx.fillStyle = 'rgba(20,26,32,.82)';
    ctx.beginPath(); ctx.moveTo(-CW / 2 + 3, -CL * .16); ctx.lineTo(-CW / 2 + 5, -CL * .28); ctx.lineTo(CW / 2 - 5, -CL * .28); ctx.lineTo(CW / 2 - 3, -CL * .16); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-CW / 2 + 4, CL * .24); ctx.lineTo(-CW / 2 + 5.5, CL * .33); ctx.lineTo(CW / 2 - 5.5, CL * .33); ctx.lineTo(CW / 2 - 4, CL * .24); ctx.fill();
    ctx.fillStyle = o.snowy ? 'rgba(255,255,255,.62)' : 'rgba(255,255,255,.2)'; rr(-CW / 2 + 4, -CL * .14, CW - 8, CL * .36, 4); ctx.fill();
    if (o.me){
      ctx.fillStyle = '#fff3cf'; ctx.fillRect(-CW / 2 + 2, -CL / 2, 6, 2.5); ctx.fillRect(CW / 2 - 8, -CL / 2, 6, 2.5);
      ctx.fillStyle = o.brake ? '#ff4a2e' : '#8a2a1e'; ctx.fillRect(-CW / 2 + 2, CL / 2 - 3, 7, 3); ctx.fillRect(CW / 2 - 9, CL / 2 - 3, 7, 3);
      ctx.strokeStyle = 'rgba(237,109,70,.9)'; ctx.lineWidth = 1.4; rr(-CW / 2, -CL / 2, CW, CL, 7); ctx.stroke();
    }
    if (o.lamp){ ctx.fillStyle = Math.sin(t * 9) > 0 ? '#ffc93a' : '#8a6a18'; ctx.beginPath(); ctx.arc(0, -2, 4, 0, 7); ctx.fill(); }
    ctx.restore();
  }
  // 気をつけをして、右手を高く上げた「僕」（黄色いヘルメット）
  function drawMe(x, y){
    ctx.save(); ctx.translate(x, y); ctx.lineCap = 'round';
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(2, 15, 9, 3.5, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#d9dee2'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-2, 2); ctx.lineTo(-2, 14); ctx.moveTo(3, 2); ctx.lineTo(3, 14); ctx.stroke();
    ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(.5, -11); ctx.lineTo(.5, 2); ctx.stroke();
    ctx.lineWidth = 3.6; ctx.beginPath(); ctx.moveTo(5, -11); ctx.lineTo(8, -27 + Math.sin(t * 2.2) * .8); ctx.moveTo(-4.5, -10); ctx.lineTo(-5.5, 1); ctx.stroke();
    ctx.fillStyle = '#e9c9a8'; ctx.beginPath(); ctx.arc(.5, -17, 4.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#f2c230'; ctx.beginPath(); ctx.arc(.5, -18.5, 5.4, Math.PI, 0); ctx.fill(); ctx.fillRect(-6.5, -19, 14, 1.8);
    ctx.restore();
  }

  function update(dt){
    t += dt; night += clamp(nightTo - night, -dt * .5, dt * .5);
    white += clamp(whiteTo - white, -dt * 2.2, dt * 2.2);
    shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt * 2.5);
    if (sup.on) sup.y += clamp(sup.to - sup.y, -150 * dt, 150 * dt);
    if (mode !== 'drive') return;
    const inLane = car.y < 40, vmax = inLane ? 130 : 215;
    car.v = key.go ? Math.min(vmax, car.v + 150 * dt) : Math.max(0, car.v - 260 * dt);
    if (car.v > vmax) car.v = Math.max(vmax, car.v - 300 * dt);
    const st = (key.r ? 1 : 0) - (key.l ? 1 : 0);
    car.a = clamp(car.a + st * car.v / 95 * dt, -1.05, 1.05);
    if (!st && inLane && car.v > 5) car.a *= Math.max(0, 1 - 1.6 * dt);          // レーンの中では、手を離すとまっすぐに戻る
    const nx = car.x + Math.sin(car.a) * car.v * dt, ny = car.y - Math.cos(car.a) * car.v * dt;
    if (!blocked(nx, ny, car.a)){ car.x = nx; car.y = ny; }
    else {   // ほかの車にふれたら、こすった＝ペナルティ（そっと止まっていればふれない）
      const v = car.v; car.v = 0;
      if (v > 20){ bumps++; shake = .45; flash = 1; hint('ガリッ……！'); if (onScrape) onScrape(); }
    }
    // 停められるか・いまの案内
    if (mode !== 'drive') return;
    const j = laneOf(), inside = car.y + CL / 2 < 8, still = car.v < 3;
    $('#dpark').disabled = !(inside && still);
    const h = car.y > APR ? 'Ｄエリアは、この先の海岸に近いあたり。' : car.y > 30 ? 'レーンの番号は、入口の路面に書いてある。' : '前の車のすぐうしろに停める。間は三十センチ。こすらないように。';
    if (h !== hintNow && !hintHold){ hintNow = h; $('#dh').textContent = h; }
  }
  let hintHold = 0;
  function hint(text){ hintNow = text; $('#dh').textContent = text; hintHold = 1; setTimeout(() => hintHold = 0, 2600); }

  function draw(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const vh = H - pad, cx = W / 2, cy = vh * .64;
    const camX = W / sc >= WW ? WW / 2 : clamp(car.x, W / sc / 2, WW - W / sc / 2), camY = car.y;
    const y0 = camY - cy / sc, y1 = camY + (H - cy) / sc, x0 = camX - cx / sc, x1 = camX + cx / sc;
    ctx.fillStyle = '#2e3338'; ctx.fillRect(0, 0, W, H);
    const sk = shake * 22;
    ctx.save(); ctx.translate(cx + (Math.random() - .5) * sk, cy + (Math.random() - .5) * sk); ctx.scale(sc, sc); ctx.translate(-camX, -camY);
    // 海
    const top = -(Math.max(...E) + FILL) * S - 30;
    if (y0 < top){ ctx.fillStyle = '#56636b'; ctx.fillRect(x0, y0, x1 - x0, top - y0); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // 通路とエリアの字
    ctx.fillStyle = '#262a2e'; ctx.fillRect(x0, APR, RX0 - x0, y1 - APR); ctx.fillRect(RX1, APR, x1 - RX1, y1 - APR);
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; ctx.setLineDash([26, 30]);
    ctx.beginPath(); ctx.moveTo(RXC, APR + 10); ctx.lineTo(RXC, SY + 200); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.font = '600 54px sans-serif';
    [['Ａ', SY - 150], ['Ｂ', 1010], ['Ｃ', 720]].forEach(([c, y]) => ctx.fillText(c, RXC + 32, y));
    ctx.font = '600 90px sans-serif'; ctx.fillText('Ｄ', WW / 2, 300);
    ctx.font = '600 15px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.fillText('↑ Ｄエリア', RXC + 4, 560); ctx.fillText('↑ Ｄエリア', RXC + 4, 900);
    // 通路の両わきのブロック（新車がならぶ）
    for (let r = Math.max(0, Math.floor((y0 - APR - 40) / S)); ; r++){
      const y = APR + 40 + S * (r + .5); if (y - S > y1) break; if (r % 9 === 8) continue;
      for (let c = 0; ; c++){
        const xl = RX0 - 8 - P * (c + .5), xr = RX1 + 8 + P * (c + .5); if (xl < x0 - P && xr > x1 + P) break;
        if (xl > x0 - P) drawCar(xl, y, 0, COLS[(r * 7 + c * 13) % COLS.length], {snowy:1});
        if (xr < x1 + P) drawCar(xr, y, 0, COLS[(r * 11 + c * 5 + 3) % COLS.length], {snowy:1});
      }
    }
    // レーン
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.6;
    for (let j = 0; j <= NL; j++){ ctx.beginPath(); ctx.moveTo(X0 + j * P, 64); ctx.lineTo(X0 + j * P, top); ctx.stroke(); }
    for (let j = 0; j < NL; j++){
      const x = laneX(j); if (x < x0 - P || x > x1 + P) continue;
      ctx.fillStyle = 'rgba(244,206,74,.85)'; ctx.fillRect(x - P / 2 + 3, 20, P - 6, 30);
      ctx.fillStyle = '#23272b'; ctx.font = '700 13px sans-serif'; ctx.fillText(String(21 + j) + '00', x, 36);
      ctx.font = '11px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.34)';
      for (let k = 0; k < E[j]; k++){ const y = -(k + .5) * S; if (y > y0 - S && y < y1 + S) ctx.fillText(slotNo(j, k), x, y); }
      for (let k = E[j]; k < E[j] + FILL; k++){
        const y = -(k + .5) * S; if (y < y0 - S || y > y1 + S) continue;
        drawCar(x, y, 0, COLS[(j * 5 + k * 3) % COLS.length], {snowy:1});
      }
    }
    // 停める場所を、路面に朱の点線で示す
    const tx = laneX(TL), ty = -(E[TL] - .5) * S;
    if (mode === 'drive'){
      ctx.save(); ctx.strokeStyle = `rgba(237,109,70,${.55 + .35 * Math.sin(t * 4)})`; ctx.lineWidth = 2.4; ctx.setLineDash([7, 5]);
      ctx.strokeRect(tx - P / 2 + 4, ty - S / 2 + 3, P - 8, S - 6); ctx.restore();
    }
    if (sup.on) drawCar(car.x, sup.y, 0, '#e8dfc4', {lamp:1});
    if (!car.hidden) drawCar(car.x, car.y, car.a, '#f1f1ee', {me:1, brake:mode === 'drive' && !key.go});
    if (hand) drawMe(car.x + (car.x > WW - 90 ? -CW / 2 - 14 : CW / 2 + 14), car.y + 4);
    ctx.restore();
    // 夜（集積所の明かり）
    if (night > 0){
      ctx.fillStyle = `rgba(6,10,24,${night * .62})`; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      [[.18, .2], [.82, .32], [.3, .62], [.74, .78]].forEach(([u, v]) => {
        const g = ctx.createRadialGradient(u * W, v * vh, 0, u * W, v * vh, Math.max(W, vh) * .3);
        g.addColorStop(0, `rgba(255,214,150,${night * .3})`); g.addColorStop(1, 'rgba(255,214,150,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      });
      ctx.globalCompositeOperation = 'source-over';
    }
    // 吹雪で遠くがかすむ
    const fr = Math.max(W, vh), fog = ctx.createRadialGradient(cx, cy - vh * .1, fr * .22, cx, cy - vh * .1, fr * .85);
    const fc = night > .5 ? '18,22,34' : '196,204,210';
    fog.addColorStop(0, `rgba(${fc},0)`); fog.addColorStop(1, `rgba(${fc},.82)`);
    ctx.fillStyle = fog; ctx.fillRect(0, 0, W, H);
    // 真横から粉雪
    const gust = .07 + .06 * Math.sin(t * .6) + (hand ? .08 : 0);
    ctx.fillStyle = `rgba(226,232,236,${gust * (1 - night * .6)})`; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.3; ctx.beginPath();
    const wind = hand ? 1.5 : 1;
    snow.forEach(p => { ctx.moveTo(p.x * W, p.y * H); ctx.lineTo(p.x * W + p.l * wind, p.y * H + p.l * .22); });
    ctx.stroke();
    // 停める場所への方角（車のまわりを回る朱の矢印と、のこりの距離）。吹雪の上に出す
    if (mode === 'drive' && !car.hidden){
      // 通路にいるあいだは、通路の出口を指す（距離は出口を回った道のり）
      const inRoad = car.y > APR, wx = inRoad ? RXC : tx, wy = inRoad ? APR : ty;
      const dx = wx - car.x, dy = wy - car.y, d = Math.hypot(dx, dy) + (inRoad ? Math.hypot(tx - RXC, ty - APR) : 0);
      if (d > 50){
        const ang = Math.atan2(dy, dx), sx = cx + (car.x - camX) * sc, sy = cy + (car.y - camY) * sc, R = 52 * sc;
        const ax = sx + Math.cos(ang) * R, ay = sy + Math.sin(ang) * R, pul = 1 + .08 * Math.sin(t * 5);
        ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang); ctx.scale(pul, pul);
        ctx.fillStyle = '#ED6D46'; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-9, -11); ctx.lineTo(-4, 0); ctx.lineTo(-9, 11); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
        const m = Math.round(d * 5 / S);   // 1台ぶん＝約5メートル
        const lx = sx + Math.cos(ang) * (R + 30), ly = sy + Math.sin(ang) * (R + 30);
        ctx.font = '700 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(20,24,28,.75)'; ctx.strokeText(`${zen(m)}ｍ`, lx, ly);
        ctx.fillStyle = '#fff'; ctx.fillText(`${zen(m)}ｍ`, lx, ly);
      }
    }
    if (flash > 0){ ctx.fillStyle = `rgba(200,50,30,${flash * .35})`; ctx.fillRect(0, 0, W, H); }
    if (white > 0){ ctx.fillStyle = `rgba(232,237,240,${white})`; ctx.fillRect(0, 0, W, H); }
  }
  const loop = now => {
    const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
    const wind = hand ? 1.5 : 1;
    snow.forEach(p => { p.x += p.v * .75 * wind * dt; p.y += p.v * .16 * dt; if (p.x > 1.05){ p.x = -.05; p.y = Math.random(); } if (p.y > 1.02) p.y = -.02; });
    update(dt); draw(); raf = requestAnimationFrame(loop);
  };

  // ボタンは押しているあいだだけ効く
  const hold = (b, k) => {
    const on = e => { e.preventDefault(); key[k] = true; b.classList.add('down'); try { b.setPointerCapture(e.pointerId); } catch (x) {} };
    const off = () => { key[k] = false; b.classList.remove('down'); };
    b.onpointerdown = on; b.onpointerup = b.onpointercancel = b.onlostpointercapture = off; b.oncontextmenu = e => e.preventDefault();
  };
  hold($('#dl'), 'l'); hold($('#dr'), 'r'); hold($('#dgo'), 'go');
  const KEYS = {ArrowLeft:'l', a:'l', ArrowRight:'r', d:'r', ArrowUp:'go', w:'go'};
  const kd = e => { if (mode === 'drive' && KEYS[e.key]){ e.preventDefault(); key[KEYS[e.key]] = true; } };
  const ku = e => { if (KEYS[e.key]) key[KEYS[e.key]] = false; };
  el.onclick = () => { if (mode !== 'drive') step(); };
  if (new URLSearchParams(location.search).has('dbg')) window.__yard = {car, key, E, laneX, TL, BASE};   // 確認用

  return {
    zen,
    // いまの行き先: レーンの番台（2800 など）と台数目。本文と同じ（２８５４）かどうか
    goal(){ return {lane:(21 + TL) * 100, slot:BASE[TL], a:A0, book:TL === 7 && BASE[TL] === 54 && A0 === 1329}; },
    open(){
      $('#pic').classList.add('out'); $('#bg').style.backgroundImage = 'none'; $('#tint').className = ''; $('#glow').classList.remove('on');
      el.classList.add('on'); mode = 'idle'; fit(); addEventListener('resize', fit); addEventListener('keydown', kd); addEventListener('keyup', ku);
      last = performance.now(); raf = requestAnimationFrame(loop);
    },
    close(){ cancelAnimationFrame(raf); removeEventListener('resize', fit); removeEventListener('keydown', kd); removeEventListener('keyup', ku); el.classList.remove('on'); sh.classList.remove('on'); $('#box').style.visibility = ''; },
    // n 台目（0 から）の紙切れで運転する
    drive(n){
      clear(); bumps = 0; hand = false; car.hidden = false; key.l = key.r = key.go = false;
      $('#dslip').textContent = `Ａ${zen(A0 + n)} → Ｄ${zen((21 + TL) * 100 + BASE[TL])}`;
      hintNow = ''; $('#dpark').disabled = true; sh.classList.add('on'); $('#box').style.visibility = 'hidden'; mode = 'drive'; fit();
      return new Promise(res => {
        const end = r => {
          onScrape = null; mode = 'idle'; car.v = 0; key.l = key.r = key.go = false; sh.classList.remove('on'); $('#box').style.visibility = '';
          setTimeout(() => { fit(); res(r); }, 380);
        };
        $('#dpark').onclick = () => {
          const j = laneOf(), gap = gapOf(j);
          if (gap > 34){ hint('もっと前へ。前の車との間は、三十センチ。'); return; }
          if (Math.abs(car.x - laneX(j)) > 12){ hint('レーンの線をまたいでいる。'); return; }
          end({ok:j === TL, tonari:Math.abs(j - TL) === 1, parked:true, gap, bumps});
        };
        $('#dhand').onclick = () => end({ok:false, hand:true, parked:false, bumps});
        onScrape = () => { onScrape = null; mode = 'stop'; key.l = key.r = key.go = false; $('#dpark').disabled = $('#dhand').disabled = true; setTimeout(() => { $('#dhand').disabled = false; end({ok:false, scraped:true, parked:false, bumps}); }, 900); };
      });
    },
    wait(){ hand = true; },
    // 監督車両がうしろから来る
    supervisor(){
      sup.on = true; sup.y = car.y + 520; sup.to = car.y + CL + 34;
      return new Promise(res => { const iv = setInterval(() => { if (Math.abs(sup.y - sup.to) < 1){ clearInterval(iv); res(); } }, 100); });
    },
    // 社員さんが車を正しい場所へ。吹雪で白くなるあいだに入れかえる
    async moved(){
      whiteTo = 1; await sleep(650);
      E[TL]--; BASE[TL]++; sup.on = false; hand = false; car.hidden = true; car.x = laneX(TL); car.y = -(E[TL] + .5) * S + 120; car.a = 0;
      whiteTo = 0; await sleep(650);
    },
    async reset(){
      whiteTo = 1; await sleep(600);
      car.x = RXC; car.y = SY; car.a = 0; car.v = 0; car.hidden = false; hand = false;
      whiteTo = 0; await sleep(500);
    },
    setNight(){ nightTo = 1; },
  };
}

// ── 紙皿に盛る ──
function feed(){
  const sh = $('#feed'), fb = $('#fb'), items = [...sh.querySelectorAll('.items button')];
  clear(); items.forEach(b => b.classList.remove('on')); fb.disabled = true; sh.classList.add('on');
  return new Promise(res => {
    items.forEach(b => b.onclick = () => { b.classList.toggle('on'); fb.disabled = !items.every(x => x.classList.contains('on')); });
    fb.onclick = () => { sh.classList.remove('on'); setTimeout(res, 350); };

// ── なでる ──
function pet(need = 6){
  const p = $('#pet'); p.classList.add('on'); let n = 0, lastT = 0;
  return new Promise(res => {
    const hit = (e, isMove) => {
      const now = performance.now(); if (isMove && now - lastT < 160) return; lastT = now;   // なでる動きだけ間引く。タップは毎回数える
      const r = p.getBoundingClientRect(), g = document.createElement('span');
      g.className = 'goro'; g.textContent = n % 2 ? 'ゴロ' : 'ゴロゴロ';
      g.style.left = (e.clientX - r.left) + 'px'; g.style.top = (e.clientY - r.top) + 'px';
      p.appendChild(g); setTimeout(() => g.remove(), 1400);
      if (++n >= need){ p.onpointerdown = p.onpointermove = null; setTimeout(() => { p.classList.remove('on'); res(); }, 900); }
    };
    p.onpointerdown = e => hit(e, false);
    p.onpointermove = e => { if (e.buttons || e.pointerType === 'touch') hit(e, true); };
  });
}

// ── 一日の流れ ─────────────────────────

// ── 大楠山の沢で砂金採り。掘る → ふるう → パンニング皿を回す → 光る粒を拾う。最後に家でバーナーで炙る ──
// dig / furui / pan / pick / burner はそれぞれ Promise を返す。粒の数は見せずに持ち回す
function makeKawa(){
  const el = $('#kawa'), cv = el.querySelector('canvas'), ctx = cv.getContext('2d'), sh = $('#pan');
  const pt = $('#pt'), pn = $('#pn'), pm = $('#pm'), pb = $('#pb'), steps = sh.querySelectorAll('.steps i');
  const DPR = Math.min(2, devicePixelRatio || 1);
  const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let W = 1, H = 1, vh = 1, mode = 'home', raf = 0, last = 0, t = 0, light = 0, lightTo = 0;
  const fit = () => { const r = el.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR; };
  const setStep = n => steps.forEach((s, i) => s.classList.toggle('on', i < n));
  const sheet = on => { sh.classList.toggle('on', on); $('#box').style.visibility = on ? 'hidden' : ''; };
  let down = null, move = null, up = null;   // いまのゲームの指の受け口
  el.onpointerdown = e => { if (!down) return; e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (x) {} const r = el.getBoundingClientRect(); down(e.clientX - r.left, e.clientY - r.top); };
  el.onpointermove = e => { if (!move) return; const r = el.getBoundingClientRect(); move(e.clientX - r.left, e.clientY - r.top); };
  el.onpointerup = el.onpointercancel = () => { if (up) up(); };
  el.onclick = () => { if (!down) step(); };

  // 沢（上から見る。水は上から下へ流れる）
  const cx = v => W / 2 + W * .06 * Math.sin(v * 4 + 1), hw = () => Math.min(W * .34, 230);
  let stones = [], digs = [], bird = {x:-1, t:6};
  const newRiver = () => {
    stones = Array.from({length:6}, (_, i) => ({u:rnd(-.75, .75), v:.12 + i * .14 + rnd(-.04, .04), s:rnd(18, 30), off:0, dir:Math.random() < .5 ? -1 : 1, used:false, a:rnd(0, 3)}));
    digs = [];
  };
  newRiver();
  const toXY = (u, v) => [cx(v) + u * hw(), v * vh];

  // フルイ網（横から見る）・パンニング皿（上から見る）
  const net = {mud:1, ph:0, used:0, splash:0, spill:[]};
  const pan = {w:0, prev:null, drag:false, sand:[], gold:[], lost:0, spray:[]};
  const R = () => Math.min(W, vh) * .4;
  let jar = 0, fly = [];
  const burn = {heat:0, on:false, fl:[]};
  if (new URLSearchParams(location.search).has('dbg')) window.__kawa = {pan, net, get mode(){ return mode; }};   // 確認用

  function drawRiver(){
    // 木々の岸
    ctx.fillStyle = '#20301f'; ctx.fillRect(0, 0, W, vh);
    for (let i = 0; i < 26; i++){
      const x = (i * 97.3) % W, y = (i * 53.7 + 20) % vh, side = x < W / 2 ? -1 : 1;
      if (Math.abs(x - cx(y / vh)) < hw() + 30) continue;
      ctx.fillStyle = i % 3 ? '#2b4428' : '#355230'; ctx.beginPath(); ctx.arc(x, y, 34 + (i % 5) * 7, 0, 7); ctx.fill();
    }
    // 水の帯（川底の砂が透ける）
    ctx.beginPath();
    for (let y = 0; y <= vh; y += 10) ctx.lineTo(cx(y / vh) - hw(), y);
    for (let y = vh; y >= 0; y -= 10) ctx.lineTo(cx(y / vh) + hw(), y);
    ctx.closePath(); ctx.fillStyle = '#8f8a6c'; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = 'rgba(70,120,130,.45)'; ctx.fillRect(0, 0, W, vh);
    // 掘ったあと
    digs.forEach(d => { const [x, y] = toXY(d.u, d.v); ctx.fillStyle = 'rgba(60,52,36,.55)'; ctx.beginPath(); ctx.ellipse(x, y, 20, 13, 0, 0, 7); ctx.fill(); });
    // 石（動かしたら、下の暗い砂が見える）
    stones.forEach(s => {
      const [x, y] = toXY(s.u, s.v);
      if (s.off > 0){ ctx.fillStyle = 'rgba(58,50,34,.6)'; ctx.beginPath(); ctx.ellipse(x, y, s.s * .9, s.s * .6, s.a, 0, 7); ctx.fill(); }
      const ox = x + s.dir * s.off * s.s * 2.2;
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(ox + 3, y + 4, s.s, s.s * .7, s.a, 0, 7); ctx.fill();
      ctx.fillStyle = '#7d7b72'; ctx.beginPath(); ctx.ellipse(ox, y, s.s, s.s * .7, s.a, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(ox - s.s * .25, y - s.s * .2, s.s * .45, s.s * .25, s.a, 0, 7); ctx.fill();
    });
    // 流れ
    ctx.strokeStyle = 'rgba(230,240,240,.35)'; ctx.lineWidth = 1.4;
    for (let i = 0; i < 40; i++){
      const u = ((i * .37) % 1.6) - .8, v = ((i * .173 + t * .09) % 1.1) - .05, [x, y] = toXY(u, v);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(t * 2 + i) * 2, y + 16 + (i % 4) * 5); ctx.stroke();
    }
    ctx.restore();
    // カワセミがときどき川の上を横切る
    bird.t -= 1 / 60;
    if (bird.t < 0 && bird.x < 0){ bird.x = 0; bird.y = rnd(.15, .6) * vh; }
    if (bird.x >= 0){
      bird.x += W / 110; const bx = bird.x, by = bird.y + Math.sin(bird.x / 30) * 6;
      ctx.fillStyle = '#2f8fb3'; ctx.beginPath(); ctx.ellipse(bx, by, 9, 4, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#e07a3a'; ctx.beginPath(); ctx.ellipse(bx + 1, by + 2, 5, 2, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#1d1d1d'; ctx.beginPath(); ctx.moveTo(bx + 9, by - 1); ctx.lineTo(bx + 17, by); ctx.lineTo(bx + 9, by + 1); ctx.fill();
      if (bird.x > W + 20){ bird.x = -1; bird.t = rnd(8, 16); }
    }
  }
  function drawNet(){
    const wy = vh * .58;
    ctx.fillStyle = '#2a3a2a'; ctx.fillRect(0, 0, W, wy);
    ctx.fillStyle = '#3f6a70'; ctx.fillRect(0, wy, W, vh - wy);
    ctx.fillStyle = '#7d7660'; ctx.fillRect(0, vh * .9, W, vh * .1);
    // 濁り（ゆすると水に泥が出る）
    if (net.splash > 0){ const g = ctx.createRadialGradient(W / 2, wy + 30, 10, W / 2, wy + 30, W * .5);
      g.addColorStop(0, `rgba(120,100,60,${net.splash * .6})`); g.addColorStop(1, 'rgba(120,100,60,0)'); ctx.fillStyle = g; ctx.fillRect(0, wy, W, vh - wy); }
    const tl = net.drag ? net.fx : Math.sin(net.ph), a = tl * .2, L = Math.min(W * .84, 560);   // 指で持っているあいだは指の傾き
    ctx.save(); ctx.translate(W / 2, wy + 6); ctx.rotate(a);
    ctx.fillStyle = 'rgba(20,20,20,.25)'; ctx.fillRect(-L / 2, -6, L, 16);
    // 網の中の砂と泥
    ctx.fillStyle = '#6e5a3c'; ctx.beginPath(); ctx.ellipse(0, -8, L * (.18 + net.mud * .2), 8 + net.mud * 12, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#a89878'; ctx.beginPath(); ctx.ellipse(0, -4, L * .16, 6, 0, Math.PI, 0); ctx.fill();
    // 枠と網目
    ctx.strokeStyle = '#c9b48f'; ctx.lineWidth = 5; ctx.strokeRect(-L / 2, -4, L, 10);
    ctx.strokeStyle = 'rgba(230,220,200,.45)'; ctx.lineWidth = 1;
    for (let x = -L / 2; x < L / 2; x += 8){ ctx.beginPath(); ctx.moveTo(x, -4); ctx.lineTo(x + 4, 6); ctx.stroke(); }
    // 両はしを抱える腕
    ctx.fillStyle = '#e9c9a8'; ctx.fillRect(-L / 2 - 14, -10, 16, 10); ctx.fillRect(L / 2 - 2, -10, 16, 10);
    ctx.restore();
    ctx.font = '600 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#efe8da';
    ctx.fillText('僕', W / 2 - L / 2, wy - 46 - tl * L * .1); ctx.fillText('義男', W / 2 + L / 2, wy - 46 + tl * L * .1);
    // こぼれた砂
    net.spill.forEach(p => { ctx.fillStyle = `rgba(168,152,120,${1 - p.t})`; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill(); });
    // 拍子の目盛り（両はしの朱のところで、ゆする）
    const gx = W / 2, gy = vh * .14, gw = Math.min(W * .7, 320);   // 朱の幅は |sin| > .75 のところ
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(gx - gw / 2, gy - 8, gw, 16);
    ctx.fillStyle = 'rgba(237,109,70,.55)'; ctx.fillRect(gx - gw / 2, gy - 8, gw * .125, 16); ctx.fillRect(gx + gw / 2 - gw * .125, gy - 8, gw * .125, 16);
    ctx.fillStyle = '#efe8da'; ctx.fillRect(gx + tl * gw / 2 - 2, gy - 12, 4, 24);
  }
  function drawPan(withGlint){
    const c = [W / 2, vh / 2], r = R();
    ctx.fillStyle = '#3f6a70'; ctx.fillRect(0, 0, W, vh);
    ctx.strokeStyle = 'rgba(230,240,240,.2)'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 18; i++){ const y = ((i * 47 + t * 30) % (vh + 40)) - 20; ctx.beginPath(); ctx.moveTo((i * 71) % W, y); ctx.lineTo((i * 71) % W + 10, y + 14); ctx.stroke(); }
    // 皿（黒い樹脂のパンニング皿。底に溝）
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(c[0] + 6, c[1] + 8, r * 1.06, 0, 7); ctx.fill();
    ctx.fillStyle = '#1f2321'; ctx.beginPath(); ctx.arc(c[0], c[1], r * 1.06, 0, 7); ctx.fill();
    ctx.fillStyle = '#2a302d'; ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
    [.35, .55, .75].forEach(k => { ctx.beginPath(); ctx.arc(c[0], c[1], r * k, 0, 7); ctx.stroke(); });
    // 水の渦
    ctx.strokeStyle = `rgba(200,230,230,${.12 + Math.min(.25, Math.abs(pan.w) * .02)})`; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++){ const a0 = pan.prevA0 = (pan.rot || 0) + i * 1.05; ctx.beginPath(); ctx.arc(c[0], c[1], r * (.5 + i * .08), a0, a0 + .8); ctx.stroke(); }
    pan.sand.forEach(p => { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(c[0] + Math.cos(p.a) * p.r * r, c[1] + Math.sin(p.a) * p.r * r, p.s, 0, 7); ctx.fill(); });
    pan.gold.forEach(p => {
      if (p.got) return;
      const x = c[0] + Math.cos(p.a) * p.r * r, y = c[1] + Math.sin(p.a) * p.r * r;
      ctx.fillStyle = '#f2c94a'; ctx.beginPath(); ctx.arc(x, y, 1.9, 0, 7); ctx.fill();
      if (withGlint){ const k = Math.max(0, Math.sin(t * 3 + p.ph * 7)); if (k > .7){ const s = (k - .7) * 30;
        ctx.strokeStyle = `rgba(255,240,180,${(k - .7) * 3})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x + s, y); ctx.moveTo(x, y - s); ctx.lineTo(x, y + s); ctx.stroke(); } }
    });
    pan.spray.forEach(p => { ctx.fillStyle = `rgba(200,190,160,${1 - p.t})`; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 7); ctx.fill(); });
    if (mode === 'pan' && sh.classList.contains('on')){   // 回す速さの目盛り
      const gx = W / 2, gy = vh * .07, gw = Math.min(W * .7, 300), k = clamp(Math.abs(pan.w) / 20, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(gx - gw / 2, gy - 6, gw, 12);
      ctx.fillStyle = 'rgba(237,109,70,.5)'; ctx.fillRect(gx - gw / 2 + gw * .2, gy - 6, gw * .35, 12);
      ctx.fillStyle = '#efe8da'; ctx.fillRect(gx - gw / 2 + gw * k - 2, gy - 10, 4, 20);
      ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(239,232,218,.7)';
      ctx.fillText('ゆっくり', gx - gw / 2 + gw * .08, gy + 22); ctx.fillText('ちょうど', gx - gw / 2 + gw * .37, gy + 22); ctx.fillText('はやすぎ', gx + gw / 2 - gw * .15, gy + 22);
    }
    if (mode === 'pick'){   // 瓶

      ctx.strokeStyle = 'rgba(239,232,218,.8)'; ctx.lineWidth = 2; ctx.strokeRect(jx - 16, jy - 26, 32, 48); ctx.fillStyle = '#c9b48f'; ctx.fillRect(jx - 18, jy - 32, 36, 7);
      ctx.fillStyle = '#f2c94a'; ctx.fillRect(jx - 14, jy + 20 - Math.min(44, jar * .4), 28, Math.min(44, jar * .4));

  }
  function drawHome(){
    const g = ctx.createRadialGradient(W / 2, vh * .3, 10, W / 2, vh * .3, Math.max(W, vh) * .8);
    g.addColorStop(0, '#4a3a2a'); g.addColorStop(1, '#16110d'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, vh);
    if (mode !== 'burner') return;
    const c = [W / 2, vh * .55], r = Math.min(W, vh) * .3;
    ctx.fillStyle = '#2a2018'; ctx.fillRect(0, c[1] + r * .5, W, vh);
    if (burn.on){   // 青い炎
      for (let i = 0; i < 3; i++){ ctx.fillStyle = `rgba(${90 + i * 40},${140 + i * 30},255,${.35 + i * .15})`;
        ctx.beginPath(); ctx.moveTo(c[0] - 12 + i * 4, c[1] + r * .9); ctx.quadraticCurveTo(c[0] + Math.sin(t * 30 + i) * 6, c[1] + r * .2, c[0] + 12 - i * 4, c[1] + r * .9); ctx.fill(); }
    }
    ctx.fillStyle = '#3a3a3a'; ctx.fillRect(c[0] - 10, c[1] + r * .88, 20, r * .5);
    // 陶器（熱くなると赤らむ）
    const hk = burn.heat / 1600;
    ctx.fillStyle = `rgb(${232 + hk * 23},${226 - hk * 90},${214 - hk * 150})`; ctx.beginPath(); ctx.ellipse(c[0], c[1], r, r * .42, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(c[0], c[1], r * .8, r * .32, 0, 0, 7); ctx.stroke();
    burn.fl.forEach(p => { ctx.fillStyle = '#f2c94a'; ctx.beginPath(); ctx.arc(c[0] + p.x * r * .7, c[1] + p.y * r * .28, 2, 0, 7); ctx.fill(); });
    if (burn.blob > 0){ ctx.fillStyle = '#f5cf55'; ctx.beginPath(); ctx.ellipse(c[0], c[1], burn.blob, burn.blob * .6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,230,.7)'; ctx.beginPath(); ctx.ellipse(c[0] - burn.blob * .3, c[1] - burn.blob * .2, burn.blob * .3, burn.blob * .15, 0, 0, 7); ctx.fill(); }
  }
  // 朝 → 昼 → 夕 → 日没
  function drawLight(){
    const L = [[200, 220, 240, .12], [0, 0, 0, 0], [237, 120, 60, .24], [20, 22, 48, .55]];
    const i = Math.floor(light), f = light - i, a = L[i], b = L[Math.min(3, i + 1)];
    const m = k => a[k] + (b[k] - a[k]) * f;
    ctx.fillStyle = `rgba(${m(0)},${m(1)},${m(2)},${m(3)})`; ctx.fillRect(0, 0, W, vh);
  }

  function update(dt){
    t += dt; light += clamp(lightTo - light, -dt * .6, dt * .6);
    stones.forEach(s => { if (s.moving) s.off = Math.min(1, s.off + dt * 2.5); });
    net.splash = Math.max(0, net.splash - dt * .8);
    net.spill.forEach(p => { p.t += dt * 1.4; p.y += 60 * dt; }); net.spill = net.spill.filter(p => p.t < 1);
    if (mode === 'furui' && !net.drag) net.ph += dt * Math.PI / .75;
    if (mode === 'pan' || mode === 'pick'){
      if (!pan.drag) pan.w *= Math.exp(-1.6 * dt);
      pan.rot = (pan.rot || 0) + pan.w * dt;
      const w2 = pan.w * pan.w, c = [W / 2, vh / 2], r = R();
      pan.sand.forEach(p => { p.a += pan.w * dt * (1 - .3 * p.r); p.r = Math.max(0, p.r + (w2 * .004 * p.k - .02) * dt); });
      pan.sand = pan.sand.filter(p => { if (p.r < 1) return true; pan.spray.push({x:c[0] + Math.cos(p.a) * r, y:c[1] + Math.sin(p.a) * r, t:0}); return false; });
      pan.gold.forEach(p => { if (p.got) return; p.a += pan.w * dt * (1 - .5 * p.r); const nr = p.r + (w2 * .0002 - .03) * dt; p.r = nr < p.r ? Math.max(nr, Math.min(p.r, p.r0)) : nr; });   // 重い粒は底の溝（r0）まで沈む
      pan.gold = pan.gold.filter(p => { if (p.got || p.r < 1) return true; pan.lost++; pan.spray.push({x:c[0] + Math.cos(p.a) * r, y:c[1] + Math.sin(p.a) * r, t:0}); return false; });
      pan.spray.forEach(p => p.t += dt * 2); pan.spray = pan.spray.filter(p => p.t < 1);
      fly.forEach(f => f.t += dt * 2.4); const n = fly.filter(f => f.t >= 1).length; if (n){ jar += n; fly = fly.filter(f => f.t < 1); }
    }
    if (mode === 'burner'){
      burn.heat = clamp(burn.heat + (burn.on ? 420 : -260) * dt, 0, 1600);
      if (burn.heat > 1000) burn.fl.forEach(p => { const k = Math.min(1, dt * (burn.heat - 1000) / 300); p.x -= p.x * k; p.y -= p.y * k; });
      const near = burn.fl.filter(p => Math.hypot(p.x, p.y) < .04);
      if (near.length){ burn.blob = Math.min(burn.max, (burn.blob || 0) + near.length * .25); burn.fl = burn.fl.filter(p => Math.hypot(p.x, p.y) >= .04); }
    }
  }
  function draw(){
    vh = H - (sh.classList.contains('on') ? sh.offsetHeight : $('#box').offsetHeight);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, vh); ctx.clip();
    if (mode === 'river' || mode === 'dig') drawRiver();
    else if (mode === 'furui') drawNet();
    else if (mode === 'pan' || mode === 'pick') drawPan(mode === 'pick' || pan.sand.length < 30);
    else drawHome();

    ctx.restore();
    ctx.fillStyle = '#0e0d0c'; ctx.fillRect(0, vh, W, H - vh);
  }
  const loop = now => { const dt = Math.min(.05, (now - last) / 1000 || 0); last = now; update(dt); draw(); raf = requestAnimationFrame(loop); };

  return {
    open(m = 'home'){ $('#pic').classList.add('out'); $('#bg').style.backgroundImage = 'none'; $('#tint').className = ''; $('#glow').classList.remove('on');
      mode = m; el.classList.add('on'); fit(); addEventListener('resize', fit); last = performance.now(); raf = requestAnimationFrame(loop); },
    close(){ cancelAnimationFrame(raf); removeEventListener('resize', fit); el.classList.remove('on'); sheet(false); },
    show(m){ mode = m; if (m === 'river') newRiver(); },
    setLight(n){ lightTo = n; },
    // 一　掘る。3回すくう。石を動かした下は砂金が多い。粒の数を返す
    dig(hint){
      mode = 'dig'; setStep(1); pt.textContent = '一　川砂を掘る'; pn.textContent = hint || '川の中を押して、スコップで砂を掘る。三杯すくってフルイ網へ。';
      pb.textContent = '川を押して、掘る'; pb.disabled = true; sheet(true);

      return new Promise(res => {
        down = (x, y) => {
          const v = y / vh, u = (x - cx(v)) / hw();

          if (s && !s.used){ s.used = true; s.moving = true; gold += Math.round(rnd(24, 38)); pn.textContent = '石を動かして、その下の砂を掘りおこした。'; }
          else { digs.push({u, v}); gold += Math.round(rnd(3, 8)); pn.textContent = 'ざくっ。'; }

      });
    },
    // 二　ふるう。義男と二人で網をゆする。端に来たときに押すと泥が抜ける。外すと砂がこぼれる
    furui(gold){
      mode = 'furui'; setStep(2); pt.textContent = '二　フルイ網をゆする';
      pn.textContent = '網を指で左右にゆする（大きく、ゆったり往復）。網が朱のところに来たときに、画面か「ゆする」を押してもいい。';
      net.mud = 1; net.ph = 0; net.used = 0; net.drag = false; net.fx = 0; pb.textContent = 'ゆする'; pb.disabled = false; sheet(true);
      const meter = () => pm.innerHTML = `${Math.round(net.mud * 100)}<small>％ 泥</small>`; meter();
      return new Promise(res => {
        pb.onclick = () => {
          const sd = Math.sin(net.ph), side = sd > 0 ? 1 : -1, k = Math.floor((net.ph + Math.PI / 2) / Math.PI);
          if (Math.abs(sd) > .75 && net.used !== k){ net.used = k; net.mud = Math.max(0, net.mud - .17); net.splash = 1; pn.textContent = side < 0 ? 'せーの。' : '「いいすね、兄貴」'; }
          else { net.mud = Math.max(0, net.mud - .03); gold -= Math.ceil(gold * .05);
            for (let i = 0; i < 8; i++) net.spill.push({x:W / 2 + side * Math.min(W * .42, 280) + rnd(-8, 8), y:vh * .58 - 10, t:rnd(0, .3)});

          net.fx = clamp((x - W / 2) / (W * .3), -1, 1);   // 画面の左に指があれば左が下がる

                for (let i = 0; i < 8; i++) net.spill.push({x:W / 2 + sd * Math.min(W * .42, 280) + rnd(-8, 8), y:vh * .58 - 10, t:rnd(0, .3)});
                pn.textContent = 'ばしゃっ。乱暴すぎて、網のはしから砂がこぼれた。'; }
              else { net.mud = Math.max(0, net.mud - (gapT < 1.6 ? .13 : .07)); net.splash = 1; pn.textContent = sd < 0 ? 'せーの。' : '「いいすね、兄貴」'; }

    },
    // 三　パンニング皿を回す。ちょうどの速さで軽い砂だけが縁から流れ出る。速すぎると砂金も飛ぶ
    pan(gold){
      mode = 'pan'; setStep(3); pt.textContent = '三　パンニング皿を回す'; pn.textContent = '皿の上を指でぐるぐるなぞって、水の中で回す。速さは朱のところ。';
      pan.w = 0; pan.lost = 0; pan.spray = []; jar = 0; fly = [];
      pan.sand = Array.from({length:140}, () => ({a:rnd(0, 6.3), r:Math.sqrt(Math.random()) * .85, k:rnd(.5, 1.5), s:rnd(1.4, 2.6), c:['#a89878', '#8e7f62', '#bfb194', '#6e624c'][Math.floor(Math.random() * 4)]}));
      pan.gold = Array.from({length:gold}, () => ({a:rnd(0, 6.3), r:Math.sqrt(Math.random()) * .7, r0:rnd(.08, .62), ph:Math.random()}));
      pb.textContent = '皿を、指で回す'; pb.disabled = true; sheet(true);
      const ang = (x, y) => Math.atan2(y - vh / 2, x - W / 2);

      move = (x, y) => {

      mode = 'burner'; setStep(0); pt.textContent = 'バーナーで炙る'; pn.textContent = '押しているあいだ、陶器をバーナーで炙る。';

        const on = e => { e.preventDefault(); burn.on = true; pb.classList.add('down'); };

        }, 100);
      });
    },
  };
}

// ── 夜のイカ釣り。投げる → しゃくる → アタリで合わせる → 巻く（イカが走るときは止める）。
//    一晩め（港）は足元の黒い影を懐中電灯で追う。二晩め（城ヶ島）は海底の光と、浮かび上がる球体 ──
function makeUmi(){
  const el = $('#umi'), cv = el.querySelector('canvas'), ctx = cv.getContext('2d'), sh = $('#ika');
  const it = $('#it'), ih = $('#ih'), im = $('#im'), ib = $('#ib'), ix = $('#ix'), il = $('#il'), ir = $('#ir');
  const DPR = Math.min(2, devicePixelRatio || 1);
  const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let W = 1, H = 1, vh = 1, raf = 0, last = 0, t = 0, view = 'side', night = 'minato', dawn = 0, dawnTo = 0;
  const fit = () => { const r = el.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR; };
  const sheet = on => { sh.classList.toggle('on', on); $('#box').style.visibility = on ? 'hidden' : ''; };
  el.onclick = () => { if (!sh.classList.contains('on')) step(); };
  // 押しているあいだだけ効くボタン
  const held = {ib:false, ix:false, il:false, ir:false};
  [[ib, 'ib'], [ix, 'ix'], [il, 'il'], [ir, 'ir']].forEach(([b, k]) => {
    b.onpointerdown = e => { e.preventDefault(); held[k] = true; b.classList.add('down'); try { b.setPointerCapture(e.pointerId); } catch (x) {} if (b.onpress) b.onpress(); };
    b.onpointerup = b.onpointercancel = b.onlostpointercapture = () => { if (!held[k]) return; held[k] = false; b.classList.remove('down'); if (b.onrelease) b.onrelease(); };
    b.oncontextmenu = e => e.preventDefault();
  });

  // 横から見た海の寸法
  const G = () => ({sy:vh * .34, fy:vh * .93, px:W * .17, tip:[W * .25, vh * .15], far:W * .95});
  // 釣りの状態
  const f = {st:'ready', pow:0, powDir:1, lx:0, ly:0, vx:0, vy:0, jerk:0, atari:0, twitch:0, hooked:null, stress:0, jet:0, jetIn:2, count:0, tries:0, lit:0, msg:''};
  let squids = [], inks = [], splash = [];
  const light = {on:false, x:0, rot:0, spin:0, y:0, stage:0, st:0, r:0, sx:0, sy:0, trail:[]};
  const joe = {stage:0, st:0, x:0, y:0, sx:0, kx:0, ky:0, bx:0, lit:0};
  if (new URLSearchParams(location.search).has('dbg')) window.__umi = {f, joe, light};   // 確認用
  const spawn = (n, near) => { const g = G(); for (let i = 0; i < n; i++){
    const x = near != null ? near + rnd(-80, 80) : rnd(g.px + 80, g.far), y = rnd(g.sy + 50, g.fy - 30);
    squids.push({x, y, a:Math.random() < .5 ? 0 : Math.PI, want:0, bite:0, gone:0, s:rnd(.8, 1.2)}); } };

  function drawSky(){
    const g = G(), sk = ctx.createLinearGradient(0, 0, 0, g.sy);
    const d = dawn;
    sk.addColorStop(0, `rgb(${10 + d * 40},${16 + d * 40},${36 + d * 60})`); sk.addColorStop(1, `rgb(${22 + d * 140},${30 + d * 80},${58 + d * 50})`);
    ctx.fillStyle = sk; ctx.fillRect(0, 0, W, g.sy);
    if (night === 'minato'){ ctx.fillStyle = '#f3ecd8'; ctx.beginPath(); ctx.arc(W * .8, vh * .1, 16, 0, 7); ctx.fill();
      const mg = ctx.createRadialGradient(W * .8, vh * .1, 10, W * .8, vh * .1, 70); mg.addColorStop(0, 'rgba(243,236,216,.35)'); mg.addColorStop(1, 'rgba(243,236,216,0)'); ctx.fillStyle = mg; ctx.fillRect(0, 0, W, g.sy); }
    else { ctx.fillStyle = 'rgba(30,34,40,.9)'; ctx.beginPath(); ctx.moveTo(W * .55, g.sy); ctx.lineTo(W * .7, g.sy - 14); ctx.lineTo(W * .9, g.sy - 9); ctx.lineTo(W, g.sy - 16); ctx.lineTo(W, g.sy); ctx.fill(); }
    for (let i = 0; i < 30; i++){ ctx.fillStyle = `rgba(255,255,255,${(.25 + .2 * Math.sin(t + i)) * (1 - d)})`; ctx.fillRect((i * 137) % W, (i * 59) % (g.sy * .8), 1.4, 1.4); }
  }
  function drawSea(){
    const g = G();
    const sg = ctx.createLinearGradient(0, g.sy, 0, g.fy); sg.addColorStop(0, '#16304a'); sg.addColorStop(1, '#070d18');

  await PARTS[id](); markPlayed(id); showMap();
}
$('#go').onclick = async () => { $('#start').classList.add('hide'); $('#tomap').hidden = false; await day(); ORDER.forEach(markPlayed); };
$('#again').onclick = showMap;
// 遊んでいる途中で地図へ戻るときは、読み込みなおして始めの状態にする
$('#tomap').onclick = () => { location.href = location.pathname + location.search.replace(/[?&]ba=[^&]*/, ''); };

showMap();
// ?ba=koi / asa / hiru / yu / yoru で地図をとばし、その場面から通しで始める（確認用）。?ba=oppama は追浜だけ
const baKey = new URLSearchParams(location.search).get('ba'), ba = ORDER.indexOf(baKey);
if (['oppama', 'sakin', 'ika', 'chase'].includes(baKey)) playOne(baKey);
else if (ba >= 0){ $('#start').classList.add('hide'); $('#tomap').hidden = false; day(ba); }
})();
</script>
</body>
</html>
